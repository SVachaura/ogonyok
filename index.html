<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Огонёк</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#fff;
  --card:#fff;
  --text:#111;
  --muted:#777;
  --line:#111;
  --soft:#f1f1f1;
  --accent:#ff5a00;
}

body.dark{
  --bg:#111;
  --card:#181818;
  --text:#fff;
  --muted:#aaa;
  --line:#fff;
  --soft:#242424;
  --accent:#ff7b00;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:85px;
}

header{
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid var(--line);
}

.logo{
  font-size:24px;
  font-weight:900;
}

.version{
  font-size:12px;
  border:2px solid var(--line);
  padding:6px 9px;
  background:var(--card);
  color:var(--text);
}

.page{
  display:none;
  padding:18px;
}

.page.active{
  display:block;
}

.hero{
  border:2px solid var(--line);
  padding:25px 18px;
  text-align:center;
  background:var(--card);
}

.fire{
  font-size:105px;
  line-height:1;
  margin:15px 0;
  animation:pulse 1.7s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.days{
  font-size:48px;
  font-weight:900;
}

.label{
  color:var(--muted);
  margin-top:4px;
}

.card{
  border:2px solid var(--line);
  background:var(--card);
  padding:16px;
  margin-top:14px;
}

.title{
  font-size:22px;
  font-weight:900;
  margin-bottom:12px;
}

.btn{
  width:100%;
  border:2px solid var(--line);
  background:var(--text);
  color:var(--bg);
  padding:13px;
  margin-top:10px;
  font-weight:900;
}

.btn.secondary{
  background:var(--card);
  color:var(--text);
}

.btn.danger{
  background:#b00020;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.skin{
  border:2px solid var(--line);
  background:var(--card);
  padding:14px;
  text-align:center;
  min-height:130px;
}

.skin.locked{
  opacity:.4;
}

.skin .preview{
  font-size:48px;
  margin-bottom:7px;
}

.skin.selected{
  outline:4px solid var(--accent);
}

.achievement{
  border:2px solid var(--line);
  padding:14px;
  margin-bottom:10px;
  background:var(--card);
}

.achievement.locked{
  opacity:.4;
}

.achievement strong{
  display:block;
  font-size:17px;
}

.event{
  border:2px solid var(--line);
  padding:16px;
  margin-top:10px;
  background:var(--card);
}

.event h3{
  margin:0 0 7px;
}

.event-date{
  color:var(--muted);
  font-size:13px;
}

.empty{
  color:var(--muted);
  padding:10px 0;
}

.setting{
  border:2px solid var(--line);
  padding:15px;
  margin-bottom:10px;
  background:var(--card);
}

.setting-title{
  font-weight:900;
  margin-bottom:8px;
}

input,textarea{
  width:100%;
  padding:12px;
  border:2px solid var(--line);
  background:var(--card);
  color:var(--text);
  outline:none;
  margin-top:8px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:var(--bg);
  border-top:2px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:10;
}

.nav{
  border:0;
  border-right:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  font-size:12px;
  font-weight:900;
}

.nav:last-child{
  border-right:0;
}

.nav.active{
  background:var(--text);
  color:var(--bg);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:30;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:450px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--text);
  border:2px solid var(--line);
  padding:18px;
}

.close{
  float:right;
  border:2px solid var(--line);
  background:var(--card);
  color:var(--text);
  width:35px;
  height:35px;
  font-weight:900;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.admin-event{
  border:2px solid var(--line);
  padding:12px;
  margin-top:10px;
}

@media(max-width:380px){
  .grid{
    grid-template-columns:1fr;
  }

  .fire{
    font-size:85px;
  }

  .days{
    font-size:40px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">Огонёк</div>

  <button class="version" onclick="openVersion()">
    v0.1
  </button>
</header>


<!-- ГЛАВНАЯ -->

<section class="page active" id="homePage">

<!-- АЧИВКИ -->

<section class="page" id="settingsPage">

    </div>

</section>

</div>


<!-- НИЖНЕЕ МЕНЮ -->

<nav class="bottom">

    onclick="showPage('homePage',this)">
    🏠<br>
    <span id="navHome">Главная</span>
  </button>

  <button class="nav"
    onclick="showPage('skinsPage',this)">
    🎨<br>
    <span id="navSkins">Скины</span>
  </button>

  <button class="nav"
    onclick="showPage('achievementsPage',this)">
    🏆<br>
    <span id="navAchievements">Ачивки</span>
  </button>

  <button class="nav"
    onclick="showPage('settingsPage',this)">
    ⚙️<br>
    <span id="navSettings">Настройки</span>
  </button>

</nav>


<!-- VERSION -->

<div class="modal" id="versionModal">

  <div class="modal-box">

    <button class="close"
      onclick="closeModal('versionModal')">
      ×
    </button>

    <div class="title">
      Огонёк v0.1
    </div>

    <p>
      Первая версия проекта.
    </p>

    <button class="btn"
      onclick="openAdminLogin()">
      🔐 Админка
    </button>

  </div>

</div>


<!-- GOOGLE LOGIN -->

<div class="modal" id="adminLoginModal">

  <div class="modal-box">

    <button class="close"
      onclick="closeModal('adminLoginModal')">
      ×
    </button>

    <div class="title">
      🔐 Админка
    </div>

    <p>
      Войдите через Google.
    </p>

    <button class="btn"
      onclick="googleLogin()">
      Войти через Google
    </button>

    <div
      id="loginStatus"
      class="small">
    </div>

  </div>

</div>


<!-- ADMIN -->

<div class="modal" id="adminModal">

  <div class="modal-box">

    <button class="close"
      onclick="closeModal('adminModal')">
      ×
    </button>

    <div class="title">
      👑 Админка
    </div>

    <div
      class="small"
      id="adminUser">
    </div>


    <div class="card">

      <div class="title">
        🎉 Создать ивент
      </div>

      <input
        id="eventName"
        placeholder="Название ивента">

      <textarea
        id="eventDescription"
        placeholder="Описание ивента"></textarea>

      <input
        id="eventReward"
        placeholder="Награда">

      <input
        id="eventStart"
        type="datetime-local">

      <input
        id="eventEnd"
        type="datetime-local">

      <button
        class="btn"
        onclick="createEvent()">
        Создать ивент
      </button>

    </div>


    <div class="card">

      <div class="title">
        Ивенты
      </div>

      <div id="adminEvents"></div>

    </div>


    <button
      class="btn"
      onclick="logout()">
      Выйти
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getDatabase,
  ref,
  push,
  set,
  remove,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDStXUlkqATov4QHOPk6HGb7DrSAs4RkGw",

  authDomain:
    "ogonyoksa.firebaseapp.com",

  databaseURL:
    "https://ogonyoksa-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "ogonyoksa",

  storageBucket:
    "ogonyoksa.firebasestorage.app",

  messagingSenderId:
    "403527501538",

  appId:
    "1:403527501538:web:d5fafa759c1931216880bb"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const provider =
  new GoogleAuthProvider();


const db =
  getDatabase(app);


/* =========================
   АДМИН
========================= */

const ADMIN_EMAIL =
  "luboeima6677@gmail.com";


/* =========================
   СКИНЫ
========================= */

const skins = [

  {
    id:"normal",
    nameRU:"Обычный",
    nameEN:"Normal",
    icon:"🔥",
    need:0
  },

  {
    id:"ice",
    nameRU:"Ледяной",
    nameEN:"Ice",
    icon:"🧊",
    need:7
  },

  {
    id:"purple",
    nameRU:"Фиолетовый",
    nameEN:"Purple",
    icon:"💜",
    need:30
  },

  {
    id:"neon",
    nameRU:"Неоновый",
    nameEN:"Neon",
    icon:"💚",
    need:90
  },

  {
    id:"electric",
    nameRU:"Электро",
    nameEN:"Electric",
    icon:"⚡",
    need:180
  },

  {
    id:"sun",
    nameRU:"Солнечный",
    nameEN:"Solar",
    icon:"☀️",
    need:365
  },

  {
    id:"diamond",
    nameRU:"Алмазный",
    nameEN:"Diamond",
    icon:"💎",
    need:720
  },

  {
    id:"space",
    nameRU:"Космический",
    nameEN:"Space",
    icon:"🌌",
    need:1000
  }

];


/* =========================
   АЧИВКИ
========================= */

const achievements = [

  {
    days:1,
    ru:"Первый огонёк",
    en:"First Flame"
  },

  {
    days:7,
    ru:"Неделя огня",
    en:"Fire Week"
  },

  {
    days:30,
    ru:"Месяц без перерыва",
    en:"One Month"
  },

  {
    days:90,
    ru:"Три месяца пламя",
    en:"Three Months"
  },

  {
    days:180,
    ru:"Половина года",
    en:"Half a Year"
  },

  {
    days:365,
    ru:"Год огня",
    en:"One Year"
  },

  {
    days:720,
    ru:"Два года огня",
    en:"Two Years"
  },

  {
    days:1000,
    ru:"Тысячный день",
    en:"1000 Days"
  }

];


/* =========================
   ЛОКАЛЬНЫЕ ДАННЫЕ
========================= */

let data =
  JSON.parse(
    localStorage.getItem(
      "ogonyokData"
    ) || "{}"
  );


if(!data.startDate){

  data.startDate =
    new Date().toISOString();

}


if(!data.skin){

  data.skin =
    "normal";

}


if(!data.language){

  data.language =
    "ru";

}


if(!data.theme){

  data.theme =
    "light";

}


save();


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "ogonyokData",
    JSON.stringify(data)
  );

}


/* =========================
   DAYS
========================= */

function calculateDays(){

  const start =
    new Date(data.startDate);

  const now =
    new Date();

  const diff =
    now.getTime() -
    start.getTime();

  return Math.max(
    1,
    Math.floor(
      diff / 86400000
    ) + 1
  );

}


/* =========================
   FIRE
========================= */

function updateFire(){

  const days =
    calculateDays();


  document.getElementById(
    "days"
  ).textContent =
    days;


  document.getElementById(
    "fire"
  ).textContent =
    getCurrentSkinIcon();


  renderAchievements();

}


/* =========================
   CURRENT SKIN
========================= */

function getCurrentSkinIcon(){

  const skin =
    skins.find(
      s => s.id === data.skin
    );

  return skin
    ? skin.icon
    : "🔥";

}


/* =========================
   RENDER SKINS
========================= */

function renderSkins(){

  const box =
    document.getElementById(
      "skinsList"
    );

  box.innerHTML = "";


  const days =
    calculateDays();


  skins.forEach(
    skin => {

      const unlocked =
        days >= skin.need;


      const selected =
        data.skin === skin.id;


      const name =
        data.language === "ru"
        ? skin.nameRU
        : skin.nameEN;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "skin " +
        (unlocked
          ? ""
          : "locked") +
        (selected
          ? " selected"
          : "");


      div.innerHTML = `

        <div class="preview">
          ${skin.icon}
        </div>

        <strong>
          ${name}
        </strong>

        <div class="small">
          ${
            unlocked
            ? (
                selected
                ? "✓ выбрано"
                : "Открыто"
              )
            : `🔒 ${skin.need} дней`
          }
        </div>

      `;


      if(unlocked){

        div.onclick =
          () => {

            data.skin =
              skin.id;

            save();

            renderSkins();

            updateFire();

          };

      }


      box.appendChild(div);

    }
  );

}


/* =========================
   ACHIEVEMENTS
========================= */

function renderAchievements(){

  const box =
    document.getElementById(
      "achievementsList"
    );

  box.innerHTML = "";


  const days =
    calculateDays();


  achievements.forEach(
    a => {

      const unlocked =
        days >= a.days;


      const name =
        data.language === "ru"
        ? a.ru
        : a.en;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "achievement " +
        (
          unlocked
          ? ""
          : "locked"
        );


      div.innerHTML = `

        <strong>
          ${
            unlocked
            ? "🔥"
            : "🔒"
          }

          ${a.days} дней
        </strong>

        <div>
          ${name}
        </div>

      `;


      box.appendChild(div);

    }
  );

}


/* =========================
   LANGUAGE
========================= */

window.setLanguage =
function(lang){

  data.language =
    lang;

  save();

  updateLanguage();

  renderSkins();

  renderAchievements();

  renderEvents();

};


function updateLanguage(){

  const ru =
    data.language === "ru";


  document.getElementById(
    "streakLabel"
  ).textContent =
    ru
    ? "ТВОЙ ОГОНЁК"
    : "YOUR FLAME";


  document.getElementById(
    "daysLabel"
  ).textContent =
    ru
    ? "дней подряд"
    : "days in a row";


  document.getElementById(
    "eventsTitle"
  ).textContent =
    ru
    ? "Ивенты"
    : "Events";


  document.getElementById(
    "skinsTitle"
  ).textContent =
    ru
    ? "Скины"
    : "Skins";


  document.getElementById(
    "achievementsTitle"
  ).textContent =
    ru
    ? "Ачивки"
    : "Achievements";


  document.getElementById(
    "settingsTitle"
  ).textContent =
    ru
    ? "Настройки"
    : "Settings";


  document.getElementById(
    "navHome"
  ).textContent =
    ru
    ? "Главная"
    : "Home";


  document.getElementById(
    "navSkins"
  ).textContent =
    ru
    ? "Скины"
    : "Skins";


  document.getElementById(
    "navAchievements"
  ).textContent =
    ru
    ? "Ачивки"
    : "Achievements";


  document.getElementById(
    "navSettings"
  ).textContent =
    ru
    ? "Настройки"
    : "Settings";

}


/* =========================
   THEME
========================= */

window.setTheme =
function(theme){

  data.theme =
    theme;

  save();

  applyTheme();

};


function applyTheme(){

  document.body.classList.toggle(
    "dark",
    data.theme === "dark"
  );

}


/* =========================
   PAGES
========================= */

window.showPage =
function(id,button){

  document
    .querySelectorAll(".page")
    .forEach(
      p =>
        p.classList.remove(
          "active"
        )
    );


  document
    .querySelectorAll(".nav")
    .forEach(
      n =>
        n.classList.remove(
          "active"
        )
    );


  document
    .getElementById(id)
    .classList.add(
      "active"
    );


  button.classList.add(
    "active"
  );

};


/* =========================
   MODALS
========================= */

window.openVersion =
function(){

  document
    .getElementById(
      "versionModal"
    )
    .classList.add(
      "show"
    );

};


window.closeModal =
function(id){

  document
    .getElementById(id)
    .classList.remove(
      "show"
    );

};


window.openAdminLogin =
function(){

  closeModal(
    "versionModal"
  );


  document
    .getElementById(
      "adminLoginModal"
    )
    .classList.add(
      "show"
    );

};


/* =========================
   GOOGLE LOGIN
========================= */

window.googleLogin =
async function(){

  const status =
    document.getElementById(
      "loginStatus"
    );


  status.textContent =
    "Открываем Google...";


  try{

    const result =
      await signInWithPopup(
        auth,
        provider
      );


    const email =
      result.user.email || "";


    if(
      email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    ){

      closeModal(
        "adminLoginModal"
      );

      openAdmin();

    }

    else{

      status.textContent =
        "Этот аккаунт не является администратором.";

      await signOut(auth);

    }

  }

  catch(error){

    status.textContent =
      "Ошибка входа: " +
      error.message;

  }

};


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user)
      return;


    if(
      user.email &&
      user.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    ){

      document.getElementById(
        "adminUser"
      ).textContent =
        "Вход выполнен: " +
        user.email;

    }

  }
);


/* =========================
   ADMIN
========================= */

function openAdmin(){

  document
    .getElementById(
      "adminModal"
    )
    .classList.add(
      "show"
    );


  loadAdminEvents();

}


window.logout =
async function(){

  await signOut(auth);

  closeModal(
    "adminModal"
  );

};


/* =========================
   CREATE EVENT
========================= */

window.createEvent =
async function(){

  const user =
    auth.currentUser;


  if(!user){

    alert(
      "Сначала войдите через Google."
    );

    return;

  }


  if(
    !user.email ||
    user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    alert(
      "Нет доступа."
    );

    return;

  }


  const name =
    document.getElementById(
      "eventName"
    ).value.trim();


  const description =
    document.getElementById(
      "eventDescription"
    ).value.trim();


  const reward =
    document.getElementById(
      "eventReward"
    ).value.trim();


  const start =
    document.getElementById(
      "eventStart"
    ).value;


  const end =
    document.getElementById(
      "eventEnd"
    ).value;


  if(!name){

    alert(
      "Введите название ивента."
    );

    return;

  }


  const eventRef =
    push(
      ref(db,"events")
    );


  await set(
    eventRef,
    {

      name:name,

      description:
        description,

      reward:
        reward,

      start:
        start,

      end:
        end,

      createdAt:
        Date.now()

    }
  );


  document.getElementById(
    "eventName"
  ).value = "";


  document.getElementById(
    "eventDescription"
  ).value = "";


  document.getElementById(
    "eventReward"
  ).value = "";


  document.getElementById(
    "eventStart"
  ).value = "";


  document.getElementById(
    "eventEnd"
  ).value = "";


  alert(
    "Ивент создан 🎉"
  );

};


/* =========================
   FIREBASE EVENTS
========================= */

const eventsRef =
  ref(db,"events");


onValue(
  eventsRef,
  snapshot => {

    const events =
      snapshot.val() || {};


    renderEvents(
      events
    );


    renderAdminEvents(
      events
    );

  }
);


/* =========================
   SHOW EVENTS
========================= */

function renderEvents(events){

  const box =
    document.getElementById(
      "eventsList"
    );


  box.innerHTML = "";


  const now =
    new Date();


  let count = 0;


  Object.entries(events)
    .forEach(
      ([id,event]) => {

        const start =
          event.start
          ? new Date(
              event.start
            )
          : null;


        const end =
          event.end
          ? new Date(
              event.end
            )
          : null;


        if(
          start &&
          now < start
        )
          return;


        if(
          end &&
          now > end
        )
          return;


        count++;


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "event";


        div.innerHTML = `

          <h3>
            🎉
            ${escapeHTML(
              event.name
            )}
          </h3>

          <div>
            ${escapeHTML(
              event.description || ""
            )}
          </div>

          ${
            event.reward
            ?
            `<p>
              🏆
              ${escapeHTML(
                event.reward
              )}
            </p>`
            :
            ""
          }

          ${
            event.end
            ?
            `<div class="event-date">
              До:
              ${escapeHTML(
                event.end
              )}
            </div>`
            :
            ""
          }

        `;


        box.appendChild(
          div
        );

      }
    );


  if(count === 0){

    box.innerHTML = `

      <div class="empty">

        ${
          data.language === "ru"
          ? "Сейчас активных ивентов нет."
          : "There are no active events."
        }

      </div>

    `;

  }

}


/* =========================
   ADMIN EVENTS
========================= */

function renderAdminEvents(events){

  const box =
    document.getElementById(
      "adminEvents"
    );


  if(!box)
    return;


  box.innerHTML = "";


  Object.entries(events)
    .forEach(
      ([id,event]) => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "admin-event";


        div.innerHTML = `

          <strong>
            🎉
            ${escapeHTML(
              event.name
            )}
          </strong>

          <div class="small">
            ${escapeHTML(
              event.description || ""
            )}
          </div>

          <button
            class="btn danger">
            Удалить
          </button>

        `;


        div
          .querySelector("button")
          .onclick =
          async () => {

            const user =
              auth.currentUser;


            if(
              !user ||
              !user.email ||
              user.email.toLowerCase() !==
              ADMIN_EMAIL.toLowerCase()
            ){

              alert(
                "Нет доступа."
              );

              return;

            }


            await remove(
              ref(
                db,
                "events/" + id
              )
            );

          };


        box.appendChild(
          div
        );

      }
    );

}


function loadAdminEvents(){

  const user =
    auth.currentUser;


  if(user){

    document.getElementById(
      "adminUser"
    ).textContent =
      "Вход выполнен: " +
      user.email;

  }

}


/* =========================
   EXPORT
========================= */

window.exportFire =
function(){

  const code =
    btoa(
      encodeURIComponent(
        JSON.stringify(
          data
        )
      )
    );


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(code)
      .then(
        () => {

          alert(
            "Код переноса скопирован 🔥"
          );

        }
      );

  }

  else{

    prompt(
      "Скопируй код:",
      code
    );

  }

};


/* =========================
   IMPORT
========================= */

window.importFire =
function(){

  const input =
    document.getElementById(
      "importCode"
    ).value.trim();


  if(!input){

    alert(
      "Введи код."
    );

    return;

  }


  try{

    const imported =
      JSON.parse(
        decodeURIComponent(
          atob(input)
        )
      );


    data = {
      ...data,
      ...imported
    };


    save();

    applyTheme();

    updateLanguage();

    renderSkins();

    updateFire();


    alert(
      "Огонёк перенесён 🔥"
    );

  }

  catch(error){

    alert(
      "Неверный код переноса."
    );

  }

};


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   START
========================= */

applyTheme();

updateLanguage();

updateFire();

renderSkins();

renderAchievements();

</script>
