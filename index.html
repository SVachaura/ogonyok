<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Держи огонёк 🔥 v0.3 Beta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2e 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      margin: 0; padding: 12px; touch-action: pan-y;
    }

    .app {
      max-width: 560px; width: 100%;
      background: rgba(20, 25, 40, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 40px; padding: 20px 16px 24px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,180,60,0.2);
      border: 1px solid rgba(255,200,100,0.3);
      max-height: 96vh; overflow-y: auto;
      position: relative;
    }

    .app::-webkit-scrollbar { width: 6px; }
    .app::-webkit-scrollbar-track { background: transparent; }
    .app::-webkit-scrollbar-thumb { background: #ffaa3355; border-radius: 10px; }

    .version-badge {
      position: absolute; top: 10px; left: 20px;
      background: #ffaa3322; color: #ffaa33;
      font-size: 0.65rem; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
      letter-spacing: 0.5px; border: 1px solid #ffaa3344;
    }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; padding: 0 6px; margin-top: 18px; gap: 8px;
    }

    .timer-badge {
      background: #2a2f44; border-radius: 40px; padding: 7px 16px;
      font-weight: 600; font-size: 0.95rem; color: #ffd966;
      box-shadow: inset 0 0 6px #00000055, 0 4px 8px #00000033;
      display: flex; align-items: center; gap: 6px;
    }

    .timer-badge span:first-child { font-size: 1.2rem; }

    /* Табы */
    .tabs {
      display: flex; gap: 6px; background: #0f1320;
      border-radius: 28px; padding: 5px; margin-bottom: 16px;
      border: 1px solid #2d3348;
    }

    .tab {
      flex: 1; padding: 11px 8px; border-radius: 22px;
      text-align: center; font-size: 0.82rem; font-weight: 600;
      color: #8892a8; cursor: pointer; transition: all 0.25s;
      letter-spacing: 0.3px; display: flex; align-items: center;
      justify-content: center; gap: 5px;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }

    .tab.active {
      background: linear-gradient(135deg, #ff7b00, #ffaa33);
      color: #fff;
      box-shadow: 0 4px 14px #ffaa3355;
    }

    .tab:not(.active):hover { color: #b9c2d4; background: #1a1f30; }

    /* Секции */
    .section { display: none; animation: fadeIn 0.3s; }
    .section.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ежедневный блок */
    .daily-block {
      background: linear-gradient(135deg, #2a1f10, #3d2a10);
      border: 1px solid #ffaa3355;
      border-radius: 24px; padding: 12px 18px;
      margin-bottom: 12px;
      display: flex; justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 18px #00000055, inset 0 0 20px #ffaa3311;
    }

    .daily-block.warning {
      background: linear-gradient(135deg, #3d1010, #5a1a1a);
      border-color: #ff444488;
    }

    .daily-block.dead {
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      border-color: #555; filter: grayscale(1);
    }

    .daily-info { display: flex; flex-direction: column; gap: 2px; }

    .daily-label {
      font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: 1.2px; color: #ffaa33aa; font-weight: 600;
    }

    .daily-status { font-size: 1.05rem; font-weight: 700; color: #ffd966; }

    .daily-days { display: flex; gap: 4px; align-items: center; }

    .day-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: #1a1f30; border: 2px solid #333a52;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; color: #556080; transition: all 0.3s;
    }

    .day-dot.filled {
      background: linear-gradient(135deg, #ff7b00, #ffaa33);
      border-color: #ffd966; color: #fff;
      box-shadow: 0 0 12px #ffaa3366;
    }

    .day-dot.today {
      border-color: #ffd966;
      animation: todayPulse 1.5s infinite;
    }

    @keyframes todayPulse {
      0%, 100% { box-shadow: 0 0 0 0 #ffaa3388; }
      50% { box-shadow: 0 0 0 8px #ffaa3300; }
    }

    /* Огонёк */
    .fire-container {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; margin: 4px 0; position: relative;
    }

    .flame-zone {
      position: relative; width: 200px; height: 200px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: transform 0.2s, filter 0.3s;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      user-select: none; touch-action: none;
    }

    .flame-zone.active { transform: scale(1.02); }

    .flame-zone.dead .flame-emoji {
      filter: grayscale(1) brightness(0.5) !important;
      animation: none !important;
    }

    .flame-emoji {
      font-size: 110px; line-height: 1;
      transition: all 0.15s;
      animation: pulse-fire 2s infinite alternate ease-in-out;
    }

    @keyframes pulse-fire {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .flame-zone.active .flame-emoji {
      animation: none; transform: scale(1.15);
    }

    /* Применение скина к огоньку через CSS-фильтр */
    .skin-default { filter: drop-shadow(0 0 25px #ffb347); }
    .skin-default.active-skin { filter: drop-shadow(0 0 55px #ffbb33) brightness(1.3); }

    .skin-blue { filter: drop-shadow(0 0 25px #47a0ff) hue-rotate(180deg); }
    .skin-blue.active-skin { filter: drop-shadow(0 0 55px #66bbff) hue-rotate(180deg) brightness(1.4); }

    .skin-green { filter: drop-shadow(0 0 25px #47ff88) hue-rotate(90deg); }
    .skin-green.active-skin { filter: drop-shadow(0 0 55px #66ffaa) hue-rotate(90deg) brightness(1.4); }

    .skin-purple { filter: drop-shadow(0 0 25px #bb47ff) hue-rotate(270deg); }
    .skin-purple.active-skin { filter: drop-shadow(0 0 55px #cc66ff) hue-rotate(270deg) brightness(1.4); }

    .skin-pink { filter: drop-shadow(0 0 25px #ff47bb) hue-rotate(310deg); }
    .skin-pink.active-skin { filter: drop-shadow(0 0 55px #ff66cc) hue-rotate(310deg) brightness(1.4); }

    .skin-gold {
      filter: drop-shadow(0 0 35px #ffd700) brightness(1.2) saturate(1.5);
      animation: pulse-fire 1.2s infinite alternate ease-in-out;
    }
    .skin-gold.active-skin {
      filter: drop-shadow(0 0 65px #ffd700) brightness(1.5) saturate(1.8);
    }

    .skin-rainbow {
      animation: rainbowSkin 3s infinite linear, pulse-fire 2s infinite alternate;
    }
    .skin-rainbow.active-skin {
      animation: rainbowSkin 1.5s infinite linear;
      transform: scale(1.15);
    }

    @keyframes rainbowSkin {
      0%   { filter: drop-shadow(0 0 25px #ff0000) hue-rotate(0deg); }
      25%  { filter: drop-shadow(0 0 25px #00ff00) hue-rotate(90deg); }
      50%  { filter: drop-shadow(0 0 25px #0000ff) hue-rotate(180deg); }
      75%  { filter: drop-shadow(0 0 25px #ff00ff) hue-rotate(270deg); }
      100% { filter: drop-shadow(0 0 25px #ff0000) hue-rotate(360deg); }
    }

    .hold-indicator {
      width: 80%; height: 8px; background: #232838;
      border-radius: 20px; margin: 14px auto 8px;
      overflow: hidden; box-shadow: inset 0 2px 6px #00000088;
    }

    .hold-progress {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ff7b00, #ffd966, #ffaa33);
      border-radius: 20px; transition: width 0.08s linear;
      box-shadow: 0 0 12px #ffb347;
    }

    .hold-label {
      text-align: center; font-size: 0.85rem; color: #b9c2d4;
      letter-spacing: 1px; margin-bottom: 6px; font-weight: 500;
      text-transform: uppercase; opacity: 0.8;
    }

    .status-area {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e2336; border-radius: 60px; padding: 11px 20px;
      margin: 8px 0 14px;
      box-shadow: inset 0 2px 6px #00000055, 0 6px 12px #00000033;
    }

    .streak { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #ffe28c; }
    .streak .number { font-size: 2rem; line-height: 1; color: #ffbb33; text-shadow: 0 0 16px #ffaa33; }

    .event-message {
      font-size: 0.85rem; color: #aab3cc; text-align: right;
      max-width: 55%; word-break: break-word; transition: color 0.2s;
    }

    .event-message.highlight {
      color: #ffd966; text-shadow: 0 0 10px #ffb347; font-weight: 600;
    }

    /* Общий стиль секции */
    .info-section {
      background: #0f1320; border-radius: 28px; padding: 14px 16px;
      margin-top: 12px; border: 1px solid #2d3348;
      box-shadow: inset 0 0 14px #00000055;
    }

    .section-title {
      display: flex; align-items: center; gap: 8px;
      color: #e0e6f0; font-weight: 600; font-size: 0.85rem;
      letter-spacing: 0.8px; text-transform: uppercase;
      margin-bottom: 12px; padding-left: 4px;
    }

    .section-title .dot {
      width: 8px; height: 8px; background: #ffaa33;
      border-radius: 50%; box-shadow: 0 0 10px #ffaa33;
    }

    /* Достижения */
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .achievement {
      background: #1a1f30; border-radius: 20px;
      padding: 12px 10px; display: flex; flex-direction: column;
      align-items: center; text-align: center; gap: 5px;
      border: 2px solid #2a3048; transition: all 0.3s;
      position: relative; overflow: hidden;
    }

    .achievement.unlocked {
      background: linear-gradient(145deg, #2a1f10, #3d2a10);
      border-color: #ffaa33;
      box-shadow: 0 0 20px #ffaa3333, inset 0 0 20px #ffaa3311;
    }

    .achievement.locked { opacity: 0.55; }

    .achievement.unlocked::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, #ffaa3322 50%, transparent 70%);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .ach-icon { font-size: 1.9rem; line-height: 1; filter: drop-shadow(0 0 8px #ffaa3366); }

    .achievement.unlocked .ach-icon {
      filter: drop-shadow(0 0 12px #ffaa33);
      animation: achPulse 2s infinite;
    }

    @keyframes achPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .ach-name { font-size: 0.78rem; font-weight: 700; color: #ffd966; line-height: 1.2; }
    .achievement.locked .ach-name { color: #8892a8; }
    .ach-desc { font-size: 0.66rem; color: #aab3cc; line-height: 1.3; }
    .ach-progress { font-size: 0.63rem; color: #ffaa33; font-weight: 600; margin-top: 2px; }

    /* Скины */
    .skins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .skin-card {
      background: #1a1f30; border-radius: 22px;
      padding: 12px 10px; display: flex; flex-direction: column;
      align-items: center; text-align: center; gap: 6px;
      border: 2px solid #2a3048; transition: all 0.3s;
      cursor: pointer; position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .skin-card:hover { border-color: #ffaa3366; transform: translateY(-2px); }

    .skin-card.owned { border-color: #ffaa33aa; }

    .skin-card.equipped {
      border-color: #ffd966;
      background: linear-gradient(145deg, #2a1f10, #3d2a10);
      box-shadow: 0 0 24px #ffaa3355, inset 0 0 20px #ffaa3322;
    }

    .skin-card.locked { opacity: 0.5; cursor: not-allowed; }

    .skin-preview {
      font-size: 2.2rem; line-height: 1;
    }

    .skin-name {
      font-size: 0.8rem; font-weight: 700; color: #ffd966;
    }

    .skin-card.locked .skin-name { color: #8892a8; }

    .skin-condition {
      font-size: 0.65rem; color: #aab3cc; line-height: 1.3;
    }

    .skin-status {
      font-size: 0.62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 3px 10px; border-radius: 12px;
      margin-top: 2px;
    }

    .skin-status.equipped {
      background: #ffd96633; color: #ffd966;
      border: 1px solid #ffd96666;
    }

    .skin-status.owned { background: #44ff8822; color: #44ff88; border: 1px solid #44ff8844; }
    .skin-status.locked { background: #333a5222; color: #8892a8; border: 1px solid #333a5266; }

    /* Задания */
    .quests-list {
      display: flex; flex-direction: column; gap: 10px;
    }

    .quest {
      background: #1a1f30; border-radius: 22px;
      padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center;
      gap: 10px; border-left: 5px solid #333a52;
      transition: all 0.3s;
    }

    .quest.completed {
      border-left-color: #44ff88;
      background: linear-gradient(145deg, #102a1a, #153a22);
    }

    .quest.claimed {
      opacity: 0.5; border-left-color: #ffaa33;
    }

    .quest-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }

    .quest-title {
      font-size: 0.88rem; font-weight: 700; color: #e0e6f0;
    }

    .quest.completed .quest-title { color: #44ff88; }
    .quest.claimed .quest-title { color: #8892a8; }

    .quest-desc { font-size: 0.72rem; color: #aab3cc; }

    .quest-progress {
      font-size: 0.7rem; color: #ffaa33; font-weight: 600; margin-top: 2px;
    }

    .quest-progress-bar {
      height: 4px; background: #232838; border-radius: 10px;
      overflow: hidden; margin-top: 4px;
    }

    .quest-progress-fill {
      height: 100%; background: linear-gradient(90deg, #ff7b00, #ffaa33);
      border-radius: 10px; transition: width 0.3s;
    }

    .quest-btn {
      background: linear-gradient(135deg, #ff7b00, #ffaa33);
      border: none; border-radius: 18px;
      padding: 9px 16px; font-size: 0.75rem; font-weight: 700;
      color: #fff; cursor: pointer; transition: all 0.2s;
      font-family: inherit; white-space: nowrap;
      box-shadow: 0 4px 10px #ffaa3344;
      -webkit-tap-highlight-color: transparent;
    }

    .quest-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 14px #ffaa3366; }
    .quest-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .quest-btn.claimed-btn { background: #333a52; color: #8892a8; }

    /* Попап достижения/скина */
    @keyframes popupIn {
      from { transform: translateX(-50%) translateY(-120%); }
      to { transform: translateX(-50%) translateY(0); }
    }

    .no-select { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
<div class="app no-select">
  <div class="version-badge">v0.3 BETA</div>

  <div class="header">
    <div class="timer-badge">
      <span>🔥</span> <span id="fireStatus">Удерживай</span>
    </div>
    <div class="timer-badge" style="background:#1e1f2c;">
      <span>🪙</span> <span id="coinsCount">0</span>
    </div>
  </div>

  <!-- Табы -->
  <div class="tabs">
    <div class="tab active" data-tab="fire">🔥 Огонёк</div>
    <div class="tab" data-tab="quests">📋 Задания</div>
    <div class="tab" data-tab="skins">🎨 Скины</div>
  </div>

  <!-- СЕКЦИЯ: ОГОНЁК -->
  <div class="section active" id="section-fire">
    <div class="daily-block" id="dailyBlock">
      <div class="daily-info">
        <div class="daily-label">Ежедневный вход</div>
        <div class="daily-status" id="dailyStatusText">Серия: 0 дней</div>
      </div>
      <div class="daily-days" id="dailyDays"></div>
    </div>

    <div class="fire-container">
      <div class="flame-zone" id="flameZone">
        <div class="flame-emoji skin-default" id="flameEmoji">🔥</div>
      </div>
      <div class="hold-indicator">
        <div class="hold-progress" id="holdProgress"></div>
      </div>
      <div class="hold-label" id="holdLabel">ЗАЖМИ И ДЕРЖИ</div>
    </div>

    <div class="status-area">
      <div class="streak">
        <span>🔥</span>
        <span class="number" id="streakCount">0</span>
      </div>
      <div class="event-message" id="eventMessage">Удерживай огонёк!</div>
    </div>

    <div class="info-section">
      <div class="section-title">
        <span class="dot"></span> ДОСТИЖЕНИЯ
      </div>
      <div class="achievements-grid" id="achievementsGrid"></div>
    </div>
  </div>

  <!-- СЕКЦИЯ: ЗАДАНИЯ -->
  <div class="section" id="section-quests">
    <div class="info-section" style="margin-top:0;">
      <div class="section-title">
        <span class="dot"></span> АКТИВНЫЕ ЗАДАНИЯ
      </div>
      <div class="quests-list" id="questsList"></div>
    </div>

    <div class="info-section">
      <div class="section-title">
        <span class="dot" style="background:#44ff88; box-shadow:0 0 10px #44ff88;"></span> ВЫПОЛНЕНО
      </div>
      <div class="quests-list" id="questsCompletedList"></div>
    </div>
  </div>

  <!-- СЕКЦИЯ: СКИНЫ -->
  <div class="section" id="section-skins">
    <div class="info-section" style="margin-top:0;">
      <div class="section-title">
        <span class="dot"></span> КОЛЛЕКЦИЯ СКИНОВ (<span id="skinsOwnedCount">1</span>/<span id="skinsTotalCount">7</span>)
      </div>
      <div class="skins-grid" id="skinsGrid"></div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ========== КОНФИГ ==========
    const HOLD_THRESHOLD_MS = 1000;
    const TICK_RATE_MS = 40;
    const MAX_DAILY_STREAK = 7;
    const STORAGE_KEY = 'fire_keep_v03_beta';

    // ========== ДОСТИЖЕНИЯ ==========
    const ACHIEVEMENTS = [
      { id: 'day1',   days: 1,   icon: '🌱', name: 'Первый шаг',    desc: 'Зашёл 1 день' },
      { id: 'day3',   days: 3,   icon: '🔥', name: 'Три дня',       desc: 'Зашёл 3 дня подряд' },
      { id: 'day7',   days: 7,   icon: '⭐', name: 'Неделя',        desc: 'Зашёл 7 дней подряд' },
      { id: 'day14',  days: 14,  icon: '💫', name: 'Две недели',    desc: 'Зашёл 14 дней подряд' },
      { id: 'day30',  days: 30,  icon: '🏆', name: 'Месяц',         desc: 'Зашёл 30 дней подряд' },
      { id: 'day60',  days: 60,  icon: '👑', name: 'Два месяца',    desc: 'Зашёл 60 дней подряд' },
      { id: 'day100', days: 100, icon: '💎', name: 'Сотка',         desc: 'Зашёл 100 дней подряд' },
      { id: 'day365', days: 365, icon: '🌟', name: 'Легенда',       desc: 'Зашёл 365 дней подряд' },
    ];

    // ========== СКИНЫ ==========
    const SKINS = [
      { id: 'default', icon: '🔥', name: 'Классика',  cssClass: 'skin-default',  condition: 'Стартовый скин', unlockedBy: null },
      { id: 'blue',    icon: '💙', name: 'Синий лёд', cssClass: 'skin-blue',     condition: 'Задание: Держи 10 сек', unlockedBy: 'hold10' },
      { id: 'green',   icon: '💚', name: 'Изумруд',   cssClass: 'skin-green',    condition: 'Задание: Удержи 50 раз', unlockedBy: 'hold50' },
      { id: 'purple',  icon: '💜', name: 'Аметист',   cssClass: 'skin-purple',   condition: 'Задание: Серия 7 дней',  unlockedBy: 'day7' },
      { id: 'pink',    icon: '💗', name: 'Розовый',   cssClass: 'skin-pink',     condition: 'Задание: Серия 14 дней', unlockedBy: 'day14' },
      { id: 'gold',    icon: '✨', name: 'Золото',    cssClass: 'skin-gold',     condition: 'Задание: Серия 30 дней', unlockedBy: 'day30' },
      { id: 'rainbow', icon: '🌈', name: 'Радуга',    cssClass: 'skin-rainbow',  condition: 'Все достижения',        unlockedBy: 'allAch' },
    ];

    // ========== ЗАДАНИЯ ==========
    const QUESTS = [
      { id: 'hold10',    title: 'Первое пламя',       desc: 'Удержи огонёк 10 секунд суммарно', target: 10,   reward: 'skin_blue',   rewardText: '💙 Синий лёд', type: 'holdSec' },

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function daysBetween(dateStr1, dateStr2) {
      const d1 = new Date(dateStr1); const d2 = new Date(dateStr2);
      return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          dailyStreak, lastVisitDate, fireDead, streak,
          unlockedAchievements, totalVisits,
          totalHoldSeconds, totalHoldCount,
          ownedSkins, equippedSkin, claimedQuests,
          savedAt: Date.now()
        }));
      } catch(e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const d = JSON.parse(raw);
        if (typeof d.dailyStreak === 'number') dailyStreak = d.dailyStreak;
        if (d.lastVisitDate) lastVisitDate = d.lastVisitDate;
        if (typeof d.fireDead === 'boolean') fireDead = d.fireDead;
        if (typeof d.streak === 'number') streak = d.streak;
        if (d.unlockedAchievements) unlockedAchievements = d.unlockedAchievements;
        if (typeof d.totalVisits === 'number') totalVisits = d.totalVisits;
        if (typeof d.totalHoldSeconds === 'number') totalHoldSeconds = d.totalHoldSeconds;
        if (typeof d.totalHoldCount === 'number') totalHoldCount = d.totalHoldCount;
        if (d.ownedSkins) ownedSkins = d.ownedSkins;
        if (d.equippedSkin) equippedSkin = d.equippedSkin;
        if (d.claimedQuests) claimedQuests = d.claimedQuests;
        return true;
      } catch(e) { return false; }
    }
