<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Ogonyok</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#fff;
color:#111;
}

body.dark{background:#111;color:#fff}
body.birthday{background:#fff4fb}
body.dark.birthday{background:#160f16}

button,input{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:920px;
min-height:100vh;
padding:20px 18px 34px;
margin:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

.brand{
font-size:20px;
font-weight:1000;
}

.versionBtn{
border:2px solid #111;
background:#fff;
color:#111;
padding:9px 12px;
font-size:13px;
font-weight:900;
}

.dark .versionBtn{
background:#111;
color:#fff;
border-color:#fff;
}

.main{
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
}

.day-label{
margin-top:38px;
font-size:24px;
font-weight:900;
}

.day-number{
font-size:58px;
line-height:1;
margin-top:5px;
font-weight:1000;
}

.flame-wrap{
margin-top:42px;
position:relative;
width:220px;
height:250px;
display:flex;
align-items:center;
justify-content:center;
}

.flame{
font-size:190px;
line-height:1;
animation:flicker 1.7s ease-in-out infinite;
position:relative;
z-index:1;
}

.flame-glow{
position:absolute;
width:135px;
height:35px;
bottom:8px;
border-radius:50%;
background:#ff9b00;
opacity:.22;
filter:blur(18px);
}

@keyframes flicker{
0%,100%{transform:scale(1) rotate(-1deg)}
50%{transform:scale(1.035) rotate(1deg)}
}

.flame-name{
font-size:20px;
font-weight:1000;
margin-top:-8px;
}

.subtitle{
font-size:15px;
color:#666;
margin-top:10px;
}

.dark .subtitle{color:#aaa}

.birthday-cake{
margin-top:18px;
border:2px solid #111;
background:#fff;
padding:10px 18px;
font-size:28px;
animation:cake 1.2s infinite;
}

.dark .birthday-cake{
background:#111;
color:#fff;
border-color:#fff;
}

@keyframes cake{
0%,100%{transform:scale(1)}
50%{transform:scale(1.08) rotate(2deg)}
}

.tabs{
display:flex;
gap:8px;
margin-top:34px;
width:100%;
}

.tab{
flex:1;
border:2px solid #111;
background:#fff;
color:#111;
padding:12px 6px;
font-weight:900;
}

.dark .tab{
background:#111;
color:#fff;
border-color:#fff;
}

.tab.active{
background:#111;
color:#fff;
}

.dark .tab.active{
background:#fff;
color:#111;
}

.panel{
width:100%;
margin-top:14px;
text-align:left;
}

.hidden{display:none!important}

.card{
border:2px solid #111;
padding:15px;
margin-bottom:10px;
display:flex;
align-items:center;
gap:12px;
background:#fff;
}

.dark .card{
background:#111;
border-color:#fff;
}

.icon{
font-size:30px;
width:38px;
text-align:center;
}

.card b{
display:block;
font-size:16px;
}

.card span{
display:block;
font-size:13px;
color:#666;
margin-top:4px;
}

.dark .card span{color:#aaa}

.achievement{
border:2px solid #111;
padding:16px;
margin-bottom:10px;
background:#fff;
}

.dark .achievement{
background:#111;
border-color:#fff;
}

.achievement-head{
display:flex;
gap:12px;
align-items:center;
}

.achievement-icon{
font-size:30px;
width:42px;
text-align:center;
}

.achievement-title{
font-size:17px;
font-weight:1000;
}

.achievement-status{
font-size:12px;
margin-top:4px;
color:#666;
}

.dark .achievement-status{color:#aaa}

.achievement.locked{
opacity:.42;
}

.progress{
height:7px;
border:2px solid #111;
margin-top:10px;
overflow:hidden;
}

.dark .progress{border-color:#fff}

.progress i{
display:block;
height:100%;
background:#111;
}

.dark .progress i{background:#fff}

.settings-title{
font-size:20px;
font-weight:1000;
margin:22px 0 10px;
}

.setting{
width:100%;
border:2px solid #111;
background:#fff;
color:#111;
padding:14px;
text-align:left;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:8px;
font-weight:900;
}

.dark .setting{
background:#111;
color:#fff;
border-color:#fff;
}

.skin-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.skin{
border:2px solid #111;
background:#fff;
color:#111;
padding:16px 8px;
text-align:center;
font-weight:900;
}

.dark .skin{
background:#111;
color:#fff;
border-color:#fff;
}

.skin.selected{
background:#111;
color:#fff;
}

.dark .skin.selected{
background:#fff;
color:#111;
}

.skin.locked{opacity:.4}

.transfer{
display:grid;
gap:8px;
}

.transfer input,
.name-input{
width:100%;
border:2px solid #111;
background:#fff;
color:#111;
padding:12px;
outline:none;
}

.dark .transfer input,
.dark .name-input{
background:#111;
color:#fff;
border-color:#fff;
}

.primary{
border:2px solid #111;
background:#111;
color:#fff;
padding:12px;
font-weight:900;
}

.dark .primary{
background:#fff;
color:#111;
border-color:#fff;
}

.extra{
border-top:2px solid #111;
margin-top:20px;
padding-top:4px;
}

.dark .extra{border-color:#fff}

.reset{
border:0;
background:none;
text-decoration:underline;
font-size:12px;
color:#777;
}

.dark .reset{color:#aaa}

.footer{
font-size:11px;
color:#999;
text-align:center;
margin-top:25px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:10000;
}

.modal-box{
width:100%;
max-width:500px;
max-height:90vh;
overflow:auto;
border:2px solid #111;
background:#fff;
color:#111;
padding:22px;
}

.dark .modal-box{
background:#111;
color:#fff;
border-color:#fff;
}

.modal-title{
font-size:23px;
font-weight:1000;
margin-bottom:10px;
}

.modal-text{
font-size:14px;
line-height:1.5;
margin-bottom:18px;
}

.modal-close{
width:100%;
border:2px solid #111;
background:#111;
color:#fff;
padding:12px;
font-weight:900;
}

.dark .modal-close{
background:#fff;
color:#111;
border-color:#fff;
}

.help-card{
border:2px solid #111;
padding:15px;
margin:10px 0;
background:#fff;
}

.dark .help-card{
background:#111;
border-color:#fff;
}

.help-card h3{
margin:0 0 8px;
}

.help-card p{
line-height:1.5;
margin:0;
}

.event-card{
border:2px solid #111;
padding:16px;
margin-bottom:10px;
background:#fff;
}

.dark .event-card{
background:#111;
border-color:#fff;
}

.event-card b{
font-size:18px;
}

.event-action{
width:100%;
padding:13px;
margin-top:10px;
border:2px solid #111;
background:#111;
color:#fff;
font-weight:900;
}

.dark .event-action{
background:#fff;
color:#111;
border-color:#fff;
}

.event-item-layer{
position:fixed;
inset:0;
z-index:9000;
pointer-events:none;
}

.event-item{
position:absolute;
pointer-events:auto;
border:0;
background:transparent;
font-size:34px;
padding:0;
animation:eventPop .18s ease;
}

.event-item .robot-hp{
display:block;
font-size:11px;
font-weight:900;
text-align:center;
}

@keyframes eventPop{
from{transform:scale(.2);opacity:0}
to{transform:scale(1);opacity:1}
}

.event-toast{
position:fixed;
left:50%;
top:18px;
transform:translateX(-50%);
z-index:10001;
border:2px solid #111;
background:#fff;
color:#111;
padding:12px 16px;
font-weight:900;
text-align:center;
box-shadow:5px 5px 0 #111;
}

.dark .event-toast{
background:#111;
color:#fff;
border-color:#fff;
box-shadow:5px 5px 0 #fff;
}

.confetti{
position:fixed;
top:-20px;
font-size:22px;
z-index:9999;
animation:fall 2.5s linear forwards;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

.birthday .flame{
filter:drop-shadow(0 8px 15px rgba(255,0,130,.3));
}

.birthday-card{
border:2px solid #111;
padding:15px;
margin-bottom:10px;
background:#fff;
}

.dark .birthday-card{
background:#111;
border-color:#fff;
}

.candy{
border:2px dashed #111;
background:#fff;
padding:13px;
width:100%;
text-align:left;
font-weight:900;
margin-bottom:8px;
}

.dark .candy{
background:#111;
color:#fff;
border-color:#fff;
}

.candy.found{
opacity:.45;
}

@media(min-width:700px){
.app{padding:28px 34px 40px}
.skin-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="brand">ogonyok</div>
<button class="versionBtn" id="versionBtn">v0.3 Beta</button>
</div>

<main class="main">

<div class="day-label" id="dayLabel">День</div>
<div class="day-number" id="dayNumber">1</div>

<div class="flame-wrap">
<div class="flame-glow"></div>
<div class="flame" id="flame">🔥</div>
</div>

<div class="flame-name" id="flameName">Мой огонёк</div>
<div class="subtitle" id="subtitle">Твой огонёк горит</div>

<button id="birthdayCake" class="birthday-cake">🎂</button>

<div class="tabs">

<button class="tab active" id="achTab">Достижения</button>
<button class="tab" id="skinsTab">Скины</button>
<button class="tab" id="settingsTab">Настройки</button>
<button class="tab" id="eventTab">Ивент</button>

</div>

<section class="panel" id="achPanel"></section>

<section class="panel hidden" id="skinsPanel">

<div class="settings-title">🎨 Скины огонька</div>

<div class="skin-grid" id="skinGrid"></div>

</section>

<section class="panel hidden" id="eventPanel">

<div class="settings-title">🎉 Ивенты</div>

<div id="eventInfo"></div>

<div class="event-card">
<b>🏆 Ачивки ивентов</b>
<div id="eventAchievements"></div>
</div>

<div class="event-card">
<b>⚙️ Детали роботов</b>
<div id="partsCount">Детали: 0</div>
<button class="event-action" id="exchangePartsBtn">
Обменять 10 деталей
</button>
</div>

</section>

<section class="panel hidden" id="settingsPanel">

<div class="settings-title">⚙️ Настройки</div>

<button class="setting" id="nameBtn">
<span>🔥 Название огонька</span>
<span>→</span>
</button>

<button class="setting" id="languageBtn">
<span>🌐 Язык</span>
<span id="languageValue">Русский</span>
</button>

<button class="setting" id="themeBtn">
<span>🌙 Тёмная тема</span>
<span id="themeValue">Выкл.</span>
</button>

<button class="setting" id="helpBtn">
<span>📖 Справка</span>
<span>→</span>
</button>

<div class="settings-title">🎂 День рождения</div>

<div class="birthday-card">

<b>Секретные конфеты</b>

<p>
Найди все 5 конфет.
</p>

<div id="candies"></div>

</div>

<div class="settings-title">📦 Перенос огонька</div>

<div class="transfer">

<button class="primary" id="createCodeBtn">
Создать код
</button>

<div id="codeBox" class="hidden">

<input id="codeValue" readonly>

</div>

<input
id="transferCode"
placeholder="Вставь код"
>

<button class="primary" id="restoreBtn">
Восстановить
</button>

</div>

<div class="extra">

<div class="settings-title">Дополнительно</div>

<div class="card">
<div>
<b>Ogonyok</b>
<span>v0.3 Beta</span>
</div>
</div>

<button class="reset" id="resetBtn">
Сбросить прогресс
</button>

</div>

</section>

</main>

<div class="footer">
Ogonyok
</div>

</div>

<script>

/* =========================================
   ОСНОВНЫЕ ДАННЫЕ
========================================= */

function dateKey(d){
return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");
}

let data=JSON.parse(
localStorage.getItem("flameData")||"null"
)||{
days:1,
lastVisit:dateKey(new Date()),
started:dateKey(new Date()),
skin:"classic",
name:"Мой огонёк"
};

function save(){
localStorage.setItem(
"flameData",
JSON.stringify(data)
);
}

/* =========================================
   ЯЗЫК
========================================= */

let lang=
localStorage.getItem("flameLang")||"ru";

const translations={
ru:{
day:"День",
burning:"Твой огонёк горит",
language:"Русский",
on:"Вкл.",
off:"Выкл.",
first:"Первый огонёк",
week:"Неделя огня",
month:"Месяц без перерыва",
three:"Три месяца пламя",
half:"Половина года",
year:"Год огня",
two:"Два года огня",
thousand:"Тысячный день"
},
en:{
day:"Day",
burning:"Your flame is burning",
language:"English",
first:"First Flame",
week:"Week of Fire",
month:"A Month Without a Break",
three:"Three Months of Flame",
half:"Half a Year",
year:"Year of Fire",
two:"Two Years of Fire",
thousand:"One Thousand Days"
}
};

function t(key){
return translations[lang][key]||
translations.ru[key]||
key;
}

/* =========================================
   СЕРИЯ
========================================= */

function updateStreak(){

const today=dateKey(new Date());

if(data.lastVisit===today){
return;
}

const last=new Date(data.lastVisit);
const now=new Date(today);

const diff=Math.floor(
(now-last)/86400000
);

if(diff===1){

data.days++;
data.lastVisit=today;

}else if(diff>1){

data.days=1;
data.lastVisit=today;
data.started=today;
data.skin="classic";

}

save();
}

/* =========================================
   АЧИВКИ
========================================= */

const achievements=[
{days:1,icon:"🔥",key:"first"},
{days:7,icon:"🔥",key:"week"},
{days:30,icon:"🔥",key:"month"},
{days:90,icon:"🔥",key:"three"},
{days:180,icon:"🔥",key:"half"},
{days:365,icon:"🔥",key:"year"},
{days:720,icon:"🔥",key:"two"},
{days:1000,icon:"🔥",key:"thousand"}
];

function renderAchievements(){

const panel=
document.getElementById("achPanel");

panel.innerHTML=
'<div class="settings-title">🏆 Достижения</div>';

achievements.forEach(a=>{

const unlocked=data.days>=a.days;

const card=document.createElement("div");

card.className=
"achievement "+
(unlocked?"":"locked");

const progress=
Math.min(
100,
Math.floor(data.days/a.days*100)
);

card.innerHTML=`

<div class="achievement-head">

<div class="achievement-icon">
${a.icon}
</div>

<div>

<div class="achievement-title">
${t(a.key)}
</div>

<div class="achievement-status">
${unlocked?
"✅ Получено":
a.days+" дней"
}
</div>

</div>

</div>

<div class="progress">
<i style="width:${progress}%"></i>
</div>

`;

panel.appendChild(card);

});

}

/* =========================================
   СКИНЫ
========================================= */

const skins=[
{
id:"classic",
name:"🔥 Классический",
days:1,
emoji:"🔥"
},
{
id:"ice",
name:"🧊 Лёд",
days:7,
emoji:"🧊"
},
{
id:"neon",
name:"💚 Неон",
days:30,
emoji:"💚"
},
{
id:"electric",
name:"⚡ Электрический",
days:90,
emoji:"⚡"
},
{
id:"rainbow",
name:"🌈 Радужный",
days:180,
emoji:"🌈"
},
{
id:"diamond",
name:"💎 Алмазный",
days:365,
emoji:"💎"
},
{
id:"dark",
name:"🖤 Тёмный",
days:720,
emoji:"🖤"
},
{
id:"legendary",
name:"👑 Легендарный",
days:1000,
emoji:"👑"
}
];

function renderSkins(){

const grid=
document.getElementById("skinGrid");

grid.innerHTML="";

skins.forEach(s=>{

const unlocked=
data.days>=s.days;

const el=
document.createElement("button");

el.className=
"skin "+
(data.skin===s.id?"selected ":"")+
(!unlocked?"locked":"");

el.innerHTML=
s.name+
"<br><small>"+s.days+" дней</small>";

el.onclick=()=>{

if(!unlocked)return;

data.skin=s.id;

save();
render();

};

grid.appendChild(el);

});

}

/* =========================================
   РЕНДЕР
========================================= */

function render(){

document.getElementById("dayNumber")
.textContent=data.days;

document.getElementById("dayLabel")
.textContent=t("day");

document.getElementById("flameName")
.textContent=data.name;

document.getElementById("subtitle")
.textContent=t("burning");

const skin=
skins.find(s=>s.id===data.skin);

document.getElementById("flame")
.textContent=
skin?skin.emoji:"🔥";

document.getElementById("languageValue")
.textContent=
translations[lang].language;

document.body.classList.toggle(
"dark",
localStorage.getItem("ogonyokDark")==="1"
);

renderAchievements();
renderSkins();
renderEventPanel();

}

/* =========================================
   ВКЛАДКИ
========================================= */

function showPanel(name){

const panels={
ach:"achPanel",
skins:"skinsPanel",
settings:"settingsPanel",
event:"eventPanel"
};

Object.values(panels).forEach(id=>{
document.getElementById(id)
.classList.add("hidden");
});

document.getElementById(panels[name])
.classList.remove("hidden");

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

if(name==="ach")
document.getElementById("achTab")
.classList.add("active");

if(name==="skins")
document.getElementById("skinsTab")
.classList.add("active");

if(name==="settings")
document.getElementById("settingsTab")
.classList.add("active");

if(name==="event")
document.getElementById("eventTab")
.classList.add("active");

}

document.getElementById("achTab").onclick=
()=>showPanel("ach");

document.getElementById("skinsTab").onclick=
()=>showPanel("skins");

document.getElementById("settingsTab").onclick=
()=>showPanel("settings");

document.getElementById("eventTab").onclick=
()=>showPanel("event");

/* =========================================
   НАЗВАНИЕ
========================================= */

document.getElementById("nameBtn").onclick=()=>{

const modal=document.createElement("div");

modal.className="modal";

modal.innerHTML=`

<div class="modal-box">

<div class="modal-title">
🔥 Название огонька
</div>

<input
class="name-input"
id="newFlameName"
value="${data.name}"
maxlength="30"
>

<button
class="modal-close"
id="saveName">
Сохранить
</button>

</div>
`;

document.body.appendChild(modal);

document.getElementById("saveName").onclick=()=>{

const value=
document.getElementById("newFlameName")
.value.trim();

if(value){
data.name=value;
save();
render();
}

modal.remove();

};

};

/* =========================================
   ЯЗЫК
========================================= */

document.getElementById("languageBtn").onclick=()=>{

lang=lang==="ru"?"en":"ru";

localStorage.setItem(
"flameLang",
lang
);

render();

};

/* =========================================
   ТЁМНАЯ ТЕМА
========================================= */

document.getElementById("themeBtn").onclick=()=>{

const enabled=
localStorage.getItem("ogonyokDark")==="1";

localStorage.setItem(
"ogonyokDark",
enabled?"0":"1"
);

render();

};

/* =========================================
   СПРАВКА
========================================= */

function openHelp(){

const modal=document.createElement("div");

modal.className="modal";

modal.innerHTML=`

<div class="modal-box">

<div class="modal-title">
📖 Справка Ogonyok
</div>

<div class="help-card">

<h3>🔥 Огонёк</h3>

<p>
Огонёк считает дни твоей серии.
Прогресс сохраняется автоматически.
</p>

</div>

<div class="help-card">

<h3>🏆 Достижения</h3>

<p>
Когда выполняется условие достижения,
оно становится полученным.
</p>

</div>

<div class="help-card">

<h3>🎉 Ивенты</h3>

<p>
Каждые 10 минут начинается случайный
ивент. Он длится 5 минут.
</p>

<p>
Во время ивента предметы появляются
поверх сайта.
</p>

</div>

<div class="help-card">

<h3>🗑️ Мусорка</h3>

<p>
Нажимай на 🗑️ и собирай мусор.
10 мусора дают +1 день.
</p>

</div>

<div class="help-card">

<p>

/* =========================================
   ПЕРЕНОС
========================================= */

function encodeData(obj){

return btoa(
unescape(
encodeURIComponent(
JSON.stringify(obj)
)
)
).replace(/=/g,"");

}

function decodeData(code){

const padded=
code+
"=".repeat(
(4-code.length%4)%4
);

return JSON.parse(
decodeURIComponent(
escape(atob(padded))
)
);

}

document.getElementById("createCodeBtn").onclick=()=>{

const transferable={
days:data.days,
lastVisit:data.lastVisit,
started:data.started,
skin:data.skin,
name:data.name
};

const code=
encodeData(transferable);

document.getElementById("codeValue")
.value=code;

document.getElementById("codeBox")
.classList.remove("hidden");

if(navigator.clipboard){

navigator.clipboard
.writeText(code)
.catch(()=>{});

}

};

document.getElementById("restoreBtn").onclick=()=>{

try{

const restored=
decodeData(
document.getElementById("transferCode")
.value.trim()
);

if(
!restored||
typeof restored.days!=="number"||
!restored.started||
!restored.lastVisit
){

throw new Error();

}

data={
days:Math.max(
1,
Math.floor(restored.days)
),
lastVisit:restored.lastVisit,
started:restored.started,
skin:restored.skin||"classic",
name:restored.name||"Мой огонёк"
};

save();
render();

alert("Прогресс восстановлен!");

}catch(e){

alert("Неверный код.");

}

};

/* =========================================
   ИВЕНТЫ
========================================= */

const EVENT_KEY="ogonyokEvents";

let eventData=
JSON.parse(
localStorage.getItem(EVENT_KEY)||"null"
)||{
parts:0,
trash:0,
eventDays:0,
speedBonus:0,
achievements:{},
lastEventSlot:-1
};

function saveEvents(){

localStorage.setItem(
EVENT_KEY,
JSON.stringify(eventData)
);

}

let currentEvent=null;
let eventItems=[];

/*
10 минут = 600 секунд.
Первые 5 минут каждого цикла = ивент.
*/

function eventSlot(){

return Math.floor(
Date.now()/600000
);

}

function eventSecond(){

return Math.floor(
Date.now()/1000
)%600;

}

function eventIsActive(){

return eventSecond()<300;

}

function eventName(){

if(currentEvent==="trash")
return "🗑️ Мусорка";

if(currentEvent==="fire")
return "🔥 Огненный дождь";

if(currentEvent==="robots")
return "🤖 Роботы";

return "Ивент";

}

function startEvent(){

if(!eventIsActive())return;

const slot=eventSlot();

if(eventData.lastEventSlot===slot)
return;

eventData.lastEventSlot=slot;

const events=[
"trash",
"fire",
"robots"
];

currentEvent=
events[
Math.floor(
Math.random()*events.length
)
];

eventData.achievements.first=true;

saveEvents();

createEventItems();

renderEventPanel();

}

function stopEvent(){

currentEvent=null;

eventItems.forEach(
x=>x.remove()
);

eventItems=[];

const layer=
document.getElementById(
"eventItemLayer"
);

if(layer)layer.remove();

renderEventPanel();

}

function createEventItems(){

const old=
document.getElementById(
"eventItemLayer"
);

if(old)old.remove();

const layer=
document.createElement("div");

layer.id="eventItemLayer";
layer.className="event-item-layer";

document.body.appendChild(layer);

eventItems=[];

if(currentEvent==="trash"){

for(let i=0;i<15;i++)
createTrash(layer);

}

if(currentEvent==="fire"){

for(let i=0;i<12;i++)
createFire(layer);

}

if(currentEvent==="robots"){

for(let i=0;i<8;i++)
createRobot(layer);

}

}

function placeEventItem(el){

el.style.left=
(Math.random()*88+4)+"%";

el.style.top=
(Math.random()*78+12)+"%";

eventItems.push(el);

}

/* МУСОР */

function createTrash(layer){

const el=
document.createElement("button");

el.className="event-item";
el.textContent="🗑️";

el.onclick=()=>{

if(currentEvent!=="trash")
return;

eventData.trash++;

el.remove();

if(eventData.trash>=10){

eventData.trash-=10;

eventRewardDay();

eventData.achievements.trash=true;

toast(
"🗑️ Мусорка",
"10 мусора → +1 день"
);

}

saveEvents();
renderEventPanel();

};

layer.appendChild(el);

placeEventItem(el);

}

/* ОГОНЬ */

function createFire(layer){

const el=
document.createElement("button");

el.className="event-item";
el.textContent="🔥";

el.onclick=()=>{

if(currentEvent!=="fire")
return;

eventRewardDay();

el.remove();

toast(
"🔥 Огонёк пойман!",
"+1 день"
);

saveEvents();

};

layer.appendChild(el);

placeEventItem(el);

}

/* РОБОТЫ */

function createRobot(layer){

const el=
document.createElement("button");

el.className="event-item";

let hp=
Math.random()<.5?2:3;

el.innerHTML=
"🤖<span class='robot-hp'>"+
hp+
" HP</span>";

el.onclick=()=>{

if(currentEvent!=="robots")
return;

hp--;

el.querySelector(
".robot-hp"
).textContent=
hp+" HP";

if(hp<=0){

eventData.parts++;

if(eventData.parts>=10)
eventData.achievements.robot=true;

el.remove();

toast(
"🤖 Робот уничтожен!",
"+1 деталь"
);

saveEvents();
renderEventPanel();

}

};

layer.appendChild(el);

placeEventItem(el);

}

/* НАГРАДА */

function eventRewardDay(){

data.days++;

save();

eventData.eventDays++;

if(eventData.eventDays>=5){

eventData.achievements.master=true;

}

saveEvents();

render();

}

/* ОБМЕН ДЕТАЛЕЙ */

function exchangeEventParts(){

if(eventData.parts<10){

toast(
"⚙️ Детали",
"Нужно 10 деталей"
);

return;

}

const choice=
confirm(
"ОК — +1 день\n"+
"Отмена — +0.1× скорости"
);

eventData.parts-=10;

if(choice){

eventRewardDay();

toast(
"⚙️ Обмен",
"+1 день"
);

}else{

eventData.speedBonus=
Math.round(
(eventData.speedBonus+.1)*10
)/10;

toast(
"⚙️ Обмен",
"+0.1× скорости"
);

}

saveEvents();
renderEventPanel();

}

document.getElementById(
"exchangePartsBtn"
).onclick=
exchangeEventParts;

/* УВЕДОМЛЕНИЕ */

function toast(title,text){

const old=
document.querySelector(
".event-toast"
);

if(old)old.remove();

const el=
document.createElement("div");

el.className="event-toast";

el.innerHTML=
"<div>"+title+"</div>"+
"<div>"+text+"</div>";

document.body.appendChild(el);

setTimeout(
()=>el.remove(),
1800
);

}

/* ИНФОРМАЦИЯ ОБ ИВЕНТЕ */

function renderEventPanel(){

const info=
document.getElementById(
"eventInfo"
);

const parts=
document.getElementById(
"partsCount"
);

const ach=
document.getElementById(
"eventAchievements"
);

if(!info||!parts||!ach)
return;

let text="Сейчас ивента нет.";

if(currentEvent){

const left=
300-eventSecond();

text=
"Сейчас: <b>"+
eventName()+
"</b><br>"+
"Осталось: <b>"+
Math.floor(left/60)+
":"+
String(left%60).padStart(2,"0")+
"</b>";

}else{

const left=
600-eventSecond();

text=
"Следующий ивент через: <b>"+
Math.floor(left/60)+
":"+
String(left%60).padStart(2,"0")+
"</b>";

}

info.innerHTML=
`
<div class="event-card">
<b>🎉 Состояние</b>
<br><br>
${text}
</div>
`;

parts.textContent=
"Детали: "+
eventData.parts+
" · бонус скорости: "+
eventData.speedBonus.toFixed(1)+
"×";

const list=[

[
"first",
"🏆 Первый ивент",
"Участвуй в любом ивенте"
],

[
"trash",
"🗑️ Мусорщик",
"Собери 10 мусора"
],

[
"robot",
"🤖 Робототехник",
"Собери 10 деталей"
],

[
"master",
"🔥 Мастер ивентов",
"Получи 5 наград от ивентов"
]

];

ach.innerHTML="";

list.forEach(a=>{

const div=
document.createElement("div");

div.className="achievement "+
(
eventData.achievements[a[0]]
?""
:"locked"
);

div.innerHTML=`

<div class="achievement-head">

<div class="achievement-icon">
${a[1].split(" ")[0]}
</div>

<div>

<div class="achievement-title">
${a[1].substring(2)}
</div>

<div class="achievement-status">
${a[2]}
<br>
${eventData.achievements[a[0]]
?"✅ Получено"
:"🔒 Пока закрыто"}
</div>

</div>

</div>

`;

ach.appendChild(div);

});

}

/* ПРОВЕРКА ИВЕНТА */

function eventTick(){

const active=
eventIsActive();

if(active&&!currentEvent){

startEvent();

}

if(!active&&currentEvent){

stopEvent();

}

renderEventPanel();

}
