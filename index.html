<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Блёбаблёб Огонёк</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <button class="lang-btn" id="langBtn">EN</button>
      <h1 data-i18n="title">🔥 Блёбаблёб Огонёк</h1>

      <!-- 👤 Имя блёба -->
      <div class="blob-name-row">
        <span class="blob-name-display" id="blobNameDisplay">Блёб</span>
        <button class="rename-btn" id="renameBtn" title="Переименовать">✏️</button>
      </div>

      <!-- 🟢 Слайм -->
      <div class="slime-wrap">
        <div class="slime gray" id="slime">
          <div class="slime-eye left"></div>
          <div class="slime-eye right"></div>
          <div class="slime-mouth"></div>
          <div class="slime-shine"></div>
        </div>
        <div class="slime-caption" id="slimeCaption">Слайм спит…</div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="label" data-i18n="level">Уровень</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="stat">
          <span class="label" data-i18n="xp">Опыт</span>
          <span class="value" id="xp">0</span>
        </div>
        <div class="stat">
          <span class="label" data-i18n="streak">Серия</span>
          <span class="value" id="streak">🔥 0</span>
        </div>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      <div class="user-badge" id="userBadge" hidden></div>
    </header>

    <main>
      <div class="quest-card" id="questCard">
        <div class="quest-icon" id="questIcon">⚔️</div>
        <h2 id="questTitle">Загрузка…</h2>
        <p id="questDesc">Подожди секунду</p>
        <button class="btn" id="completeBtn" disabled>...</button>
        <button class="btn skip-btn" id="skipBtn" hidden></button>
      </div>

      <div class="history">
        <h3 data-i18n="history">📜 История</h3>
        <ul id="historyList"></ul>
      </div>

      <details class="settings">
        <summary data-i18n="settings">⚙️ Настройки и синхронизация</summary>
        <div class="settings-body">
          <div class="setting-block">
            <div class="block-title" data-i18n="account">👤 Аккаунт</div>
            <div id="authGuest">
              <button class="mini-btn primary" id="loginGoogleBtn" data-i18n="loginGoogle">Войти через Google</button>
              <button class="mini-btn" id="loginAnonBtn" data-i18n="loginAnon">Анонимно</button>
            </div>
            <div id="authUser" hidden>
              <div class="user-info" id="userInfo"></div>
              <button class="mini-btn" id="logoutBtn" data-i18n="logout">Выйти</button>
              <button class="mini-btn" id="forceSyncBtn" data-i18n="forceSync">Синхронизировать сейчас</button>
            </div>
            <div class="sync-status" id="syncStatus"></div>
          </div>

          <div class="setting-block">
            <div class="block-title" data-i18n="fileSync">💾 Резервная копия</div>
            <div class="row">
              <button class="mini-btn" id="exportBtn" data-i18n="export">💾 Сохранить</button>
              <button class="mini-btn" id="importBtn" data-i18n="import">📂 Загрузить</button>
            </div>
            <input type="file" id="importFile" accept=".json" hidden>
          </div>

          <div class="setting-block">
            <div class="block-title" data-i18n="codeSync">🔗 Код синхронизации</div>
            <div class="row">
              <button class="mini-btn" id="syncOutBtn" data-i18n="getCode">Получить код</button>
