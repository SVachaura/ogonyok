html,body{

    font-family:Consolas,Monaco,"Courier New",monospace;
}

body{
    overflow:hidden;
}

#terminal{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    padding:15px 14px 75px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.line{
    min-height:22px;
}

.cmd{
    color:#fff;
}

.info{
    color:#00cfff;
}

.success{
    color:#00ff66;
}

.error{
    color:#ff4444;
}

.warning{
    color:#ffd000;
}

.title{
    color:#00ff66;
    font-weight:bold;
}

.dim{
    color:#777;
}

.inputbar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    min-height:55px;
    display:flex;
    align-items:center;
    padding:9px 12px;
    background:#000;
    border-top:1px solid #00ff66;
    z-index:10;
}

.prompt{
    color:#00ff66;
    white-space:nowrap;
    margin-right:8px;
}

#input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font:inherit;
    font-size:16px;
}

.cursor{
    width:8px;
    height:18px;
    background:#00ff66;
    display:inline-block;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%,45%{opacity:1}
    46%,100%{opacity:0}
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:#000;
}

::-webkit-scrollbar-thumb{
    background:#00ff66;
}

::selection{
    background:#00ff66;
    color:#000;
}
</style>
</head>

function searchCommands(query){

    query=query.toLowerCase().trim();

    if(!query){

        print("Использование: /search текст","warning");
        return;

    }

    const results=allNames.filter(name=>{

        return name.toLowerCase().includes(query) ||
               allCommands[name].category.includes(query) ||
               allCommands[name].description.toLowerCase().includes(query);

    });

    print("SEARCH: "+query);
    print("FOUND: "+results.length);
    print("");

    if(results.length===0){

        print("Ничего не найдено.","error");
        return;

    }

    const limit=Math.min(results.length,50);

    for(let i=0;i<limit;i++){

        const name=results[i];

        print(
            name+
            "  ["+
            allCommands[name].category+
            "] — "+
            allCommands[name].description
        );

    }

    if(results.length>50){

        print("");
        print("Показаны первые 50 результатов.","dim");

    }

}

function showPage(number){

    number=parseInt(number)||1;

    const perPage=100;

    const totalPages=Math.ceil(allNames.length/perPage);

    if(number<1)number=1;
    if(number>totalPages)number=totalPages;

    currentPage=number;

    const start=(number-1)*perPage;

    const end=Math.min(
        start+perPage,
        allNames.length
    );

    print("╔══════════════════════════════════════════════════╗","title");
    print("║              COMMAND DATABASE                   ║","title");
    print("╚══════════════════════════════════════════════════╝","title");

    print("");

    print(
        "PAGE "+
        number+
        "/"+
        totalPages+
        " | COMMANDS: 10000+"
    );

    print("");

    for(let i=start;i<end;i++){

        const name=allNames[i];
        const data=allCommands[name];

        print(
            String(i+1).padStart(5,"0")+
            "  "+
            name+
            "  ["+
            data.category+
            "]"
        );

    }

    print("");

    print("Следующая: /page "+(number+1));
    print("Предыдущая: /page "+(number-1));

}

function randomNumber(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;

}

function uuid(){

    if(crypto.randomUUID){

        return crypto.randomUUID();

    }

    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
        /[xy]/g,
        function(c){

            const r=Math.random()*16|0;
            const v=c==="x"?r:(r&3|8);

            return v.toString(16);

        }
    );

}

function runCommand(raw){

    const command=raw.trim();

    if(!command)return;

    print(
        "user@terminal:~$ "+command,
        "cmd"
    );

    history.push(command);

    historyPosition=history.length;

    const parts=command.split(/\s+/);

    const cmd=parts[0].toLowerCase();

    const args=parts.slice(1).join(" ");

    switch(cmd){

        case "/adminmenu":
            adminMenu();
            break;

        case "/help":

            print("HELP","title");
            print("");
            print("/adminmenu");
            print("/commands");
            print("/search <текст>");
            print("/info <команда>");
            print("/page <номер>");
            print("/category <категория>");
            print("/randomcommand");
            print("/clear");
            print("");
            print("Всего: 10000+ команд.","success");

            break;

        case "/clear":

            clearScreen();

            break;

        case "/about":

            showAbout();

            break;

        case "/version":

            print("Terminal v2.0");

            break;

        case "/date":

            print(
                new Date().toLocaleDateString("ru-RU")
            );

            break;

        case "/time":

            print(
                new Date().toLocaleTimeString("ru-RU")
            );

            break;

        case "/datetime":

            print(
                new Date().toLocaleString("ru-RU")
            );

            break;

        case "/whoami":

            print("user");

            break;

        case "/status":

            print("TERMINAL: ONLINE","success");
            print("DATABASE: ONLINE","success");
            print("COMMANDS: 10000+","success");

            break;

        case "/system":

            showSystem();

            break;

        case "/device":

            print("PLATFORM: "+navigator.platform);
            print("CORES: "+(navigator.hardwareConcurrency||"unknown"));

            break;

        case "/browser":

            print(navigator.userAgent);

            break;

        case "/screen":

            print(
                screen.width+
                " x "+
                screen.height
            );

            break;

        case "/language":

            print(navigator.language);

            break;

        case "/online":

            print(
                navigator.onLine?
                "ONLINE":
                "OFFLINE"
            );

            break;

        case "/ping":

            print("PING...");

            setTimeout(()=>{

                print(
                    randomNumber(15,80)+
                    " ms",
                    "success"
                );

            },300);

            break;

        case "/random":

            print(
                randomNumber(1,100)
            );

            break;

        case "/number":

            print(
                randomNumber(1,100)
            );

            break;

        case "/coin":

            print(
                Math.random()>0.5?
                "ОРЁЛ":
                "РЕШКА"
            );

            break;

        case "/dice":

            print(
                "🎲 "+
                randomNumber(1,6)
            );

            break;

        case "/matrix":

            matrix();

            break;

        case "/hack":

            fakeHack();

            break;

        case "/scan":

            fakeScan();

            break;

        case "/network":

            print(
                "NETWORK: "+
                (navigator.onLine?"ONLINE":"OFFLINE")
            );

            break;

        case "/cookies":

            print(
                navigator.cookieEnabled?
                "COOKIES: ENABLED":
                "COOKIES: DISABLED"
            );

            break;

        case "/storage":

            print("LOCAL STORAGE: AVAILABLE");
            print("SESSION STORAGE: AVAILABLE");

            break;

        case "/memory":

            if(performance.memory){

                print(
                    "USED: "+
                    Math.round(
                        performance.memory.usedJSHeapSize/
                        1024/
                        1024
                    )+
                    " MB"
                );

            }else{

                print(
                    "Memory information unavailable."
                );

            }

            break;

        case "/cpu":

            print(
                "LOGICAL CORES: "+
                (navigator.hardwareConcurrency||"unknown")
            );

            break;

        case "/battery":

            if(navigator.getBattery){

                navigator.getBattery().then(b=>{

                    print(
                        "BATTERY: "+
                        Math.round(b.level*100)+
                        "%"
                    );

                    print(
                        "CHARGING: "+
                        (b.charging?"YES":"NO")
                    );

                });

            }else{

                print(
                    "Battery information unavailable."
                );

            }

            break;

        case "/fullscreen":

            document.documentElement.requestFullscreen?.();

            break;

        case "/exitfullscreen":

            document.exitFullscreen?.();

            break;

        case "/reload":

            location.reload();

            break;

        case "/theme":

            print("THEMES:");
            print("/dark");
            print("/light");
            print("/green");
            print("/blue");
            print("/red");
            print("/purple");
            print("/resettheme");

            break;

        case "/dark":

            document.body.style.background="#000";
            document.body.style.color="#fff";

            print("Dark theme enabled.");

            break;

        case "/light":

            document.body.style.background="#fff";
            document.body.style.color="#000";

            print("Light theme enabled.");

            break;

        case "/green":

            document.body.style.background="#000";
            document.body.style.color="#00ff66";

            print("Green theme enabled.");

            break;

        case "/blue":

            document.body.style.background="#000";
            document.body.style.color="#00aaff";

            print("Blue theme enabled.");

            break;

        case "/red":

            document.body.style.background="#000";
            document.body.style.color="#ff4444";

            print("Red theme enabled.");

            break;

        case "/purple":

            document.body.style.background="#000";
            document.body.style.color="#cc66ff";

            print("Purple theme enabled.");

            break;

        case "/resettheme":

            document.body.style.background="#000";
            document.body.style.color="#00ff66";

            print("Theme reset.");

            break;

        case "/history":

            if(history.length===0){

                print("History is empty.");

            }else{

                history.forEach((x,i)=>{

                    print(
                        (i+1)+": "+x
                    );

                });

            }

            break;

        case "/historyclear":

            history=[];
            historyPosition=0;

            print("History cleared.","success");

            break;

        case "/commands":

            print("COMMANDS: 10000+","success");
            print("");
            print("Используй /page 1");

            break;

        case "/randomcommand":

            randomCommand();

            break;

        case "/search":

            searchCommands(args);

            break;

        case "/find":

            commandInfo(args);

            break;

        case "/info":

            commandInfo(args);

            break;

        case "/category":

            showCategory(args);

            break;

        case "/page":

            showPage(args);

            break;

        case "/debug":

            print("DEBUG MODE","warning");
            print("Commands: "+allNames.length);
            print("Generated: "+TOTAL_COMMANDS);
            print("Special: "+Object.keys(specialCommands).length);

            break;

        case "/logs":

            print("LOG: Terminal initialized");
            print("LOG: Command database loaded");
            print("LOG: 10000+ commands ready");
            print("LOG: Session active");

            break;

        case "/clearlogs":

            print("Logs cleared.","success");

            break;

        case "/test":

            print("Running system test...");

            setTimeout(()=>print("COMMAND DATABASE: OK","success"),300);
            setTimeout(()=>print("TERMINAL: OK","success"),600);
            setTimeout(()=>print("INTERFACE: OK","success"),900);
            setTimeout(()=>print("TEST COMPLETE","success"),1200);

            break;

        case "/check":

            print("HTML: OK","success");
            print("CSS: OK","success");
            print("JAVASCRIPT: OK","success");
            print("DATABASE: OK","success");

            break;

        case "/uptime":

            print(
                Math.floor(
                    (Date.now()-bootTime)/1000
                )+
                " seconds"
            );

            break;

        case "/session":

            let sid=
                localStorage.getItem("terminal_session");

            if(!sid){

                sid="SESSION-"+randomNumber(100000,999999);

                localStorage.setItem(
                    "terminal_session",
                    sid
                );

            }

            print(sid);

            break;

        case "/id":

            print(
                "USR-"+randomNumber(100000,999999)
            );

            break;

        case "/generateid":

            print(
                "USR-"+randomNumber(
                    10000000,
                    99999999
                )
            );

            break;

        case "/uuid":

            print(uuid());

            break;

        case "/password":

            const chars=
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ"+
                "abcdefghijklmnopqrstuvwxyz"+
                "0123456789!@#$%";

            let password="";

            for(let i=0;i<16;i++){

                password+=
                    chars[
                        randomNumber(
                            0,
                            chars.length-1
                        )
                    ];

            }

            print(password,"success");

            break;

        case "/key":

            print(uuid().replaceAll("-",""));

            break;

        case "/token":

            print(
                "tok_"+
                uuid().replaceAll("-","")
            );

            break;

        case "/hash":

            if(!args){

                print(
                    "Использование: /hash текст",
                    "warning"
                );

                break;

            }

            crypto.subtle.digest(
                "SHA-256",
                new TextEncoder().encode(args)
            ).then(buffer=>{

                const hash=
                    Array.from(
                        new Uint8Array(buffer)
                    ).map(
                        b=>b.toString(16).padStart(2,"0")
                    ).join("");

                print(hash,"success");

            });

            break;

        case "/encode":

            if(!args){

                print(
                    "Использование: /encode текст"
                );

                break;

            }

            try{

                print(
                    btoa(
                        unescape(
                            encodeURIComponent(args)
                        )
                    );

                }catch(e){

                print("Encoding error.","error");

            }

            break;

        case "/decode":

            if(!args){

                print(
                    "Использование: /decode текст"
                );

                break;

            }

            try{

                print(
                    decodeURIComponent(
                        escape(
                            atob(args)
                        )
                    )
                );

            }catch(e){

                print(
                    "Decoding error.",
                    "error"
                );

            }

            break;

        case "/base64":

            print(
                "Используй /encode или /decode."
            );

            break;

        case "/json":

            print(
                '{ "terminal": "online", "commands": "10000+" }'
            );

            break;

        case "/html":

            print(
                "HTML = структура страницы."
            );

            break;

        case "/css":

            print(
                "CSS = оформление страницы."
            );

            break;

        case "/js":

            print(
                "JavaScript = логика страницы."
            );

            break;

        case "/calc":

            if(!args){

                print(
                    "Использование: /calc 2+2*5"
                );

                break;

            }

            try{

                if(!/^[0-9+\-*/().%\s]+$/.test(args)){

                    throw new Error();

                }

                const result=
                    Function(
                        '"use strict";return ('+
                        args+
                        ')'
                    )();

                print("= "+result,"success");

            }catch(e){

                print(
                    "Ошибка вычисления.",
                    "error"
                );

            }

            break;

        case "/timer":{

            let seconds=parseInt(args)||10;

            print(
                "Timer: "+
                seconds+
                " seconds"
            );

            const timer=setInterval(()=>{

                seconds--;

                if(seconds<=0){

                    clearInterval(timer);

                    print(
                        "TIMER COMPLETE",
                        "success"
                    );

                }

            },1000);

            break;

        }

        case "/countdown":{

            let count=parseInt(args)||10;

            const countdown=setInterval(()=>{

                print(String(count));

                count--;

                if(count<0){

                    clearInterval(countdown);

                    print(
                        "GO!",
                        "success"
                    );

                }

            },1000);

            break;

        }

        case "/stopwatch":{

            const started=Date.now();

            print("STOPWATCH STARTED");

            setTimeout(()=>{

                print(
                    "STOPWATCH: "+
                    Math.floor(
                        (Date.now()-started)/1000
                    )+
                    " seconds"
                );

            },10000);

            break;

        }

        case "/notes":

            if(!args){

                print(
                    "Использование: /notes текст"
                );

                break;

            }

            localStorage.setItem(
                "terminal_note",
                args
            );

            print(
                "NOTE SAVED",
                "success"
            );

            break;

        case "/quote":{

            const quotes=[
                "Каждый проект начинается с первой строки.",
                "Ошибки помогают учиться.",
                "Продолжай создавать.",
                "Новая команда — новая возможность."
            ];

            print(
                quotes[
                    randomNumber(
                        0,
                        quotes.length-1
                    )
                ]
            );

            break;

        }

        case "/joke":{

            const jokes=[
                "404: шутка не найдена.",
                "У программиста было 10 проблем. Он исправил одну — стало 11.",
                "Баги тоже хотят внимания."
            ];

            print(
                jokes[
                    randomNumber(
                        0,
                        jokes.length-1
                    )
                ]
            );

            break;

        }

        case "/easteregg":

            print("🥚 EASTER EGG FOUND!","success");
            print("TERMINAL MASTER");

            break;

        case "/shutdown":

            print(
                "TERMINAL SHUTTING DOWN...",
                "warning"
            );

            terminalOnline=false;

            setTimeout(()=>{

                clearScreen();

                print(
                    "TERMINAL OFFLINE",
                    "error"
                );

                print(
                    "Перезагрузите страницу для запуска."
                );

            },700);

            break;

        default:

            if(allCommands[cmd]){

                commandInfo(cmd);

            }else{

                print(
                    "COMMAND NOT FOUND: "+cmd,
                    "error"
                );

                print(
                    "Введите /adminmenu или /help.",
                    "info"
                );

            }

            break;

    }

}

/* =========================================================
   КЛАВИАТУРА
   ========================================================= */

input.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        if(!terminalOnline)return;

        runCommand(input.value);

        input.value="";

        return;

    }

    if(e.key==="ArrowUp"){

        e.preventDefault();

        if(history.length===0)return;

        historyPosition=
            Math.max(
                0,
                historyPosition-1
            );

        input.value=
            history[historyPosition];

    }

    if(e.key==="ArrowDown"){

        e.preventDefault();

        if(history.length===0)return;

        historyPosition=
            Math.min(
                history.length,
                historyPosition+1
            );

        input.value=
            historyPosition===history.length
            ? ""
            : history[historyPosition];

    }

});

document.addEventListener(
    "click",
    ()=>input.focus()
);

/* =========================================================
   ЗАПУСК
   ========================================================= */

welcome();

input.focus();
