<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Огонёк</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
body{display:flex;justify-content:center}
.app{width:100%;max-width:520px;min-height:100vh;padding:20px 18px 34px;display:flex;flex-direction:column}
.top{display:flex;justify-content:flex-end}
.lang{border:2px solid #111;background:#fff;padding:9px 12px;font-size:14px;font-weight:800;cursor:pointer}
.main{text-align:center;flex:1;display:flex;flex-direction:column;align-items:center}
.day-label{margin-top:38px;font-size:24px;font-weight:900}
.day-number{font-size:58px;line-height:1;margin-top:5px;font-weight:1000}
.flame-wrap{margin-top:42px;position:relative;width:220px;height:250px;display:flex;align-items:center;justify-content:center}
.flame{font-size:190px;line-height:1;filter:drop-shadow(0 7px 10px rgba(255,115,0,.18));animation:flicker 1.7s ease-in-out infinite}
.flame-glow{position:absolute;width:135px;height:35px;bottom:8px;border-radius:50%;background:#ff9b00;opacity:.22;filter:blur(18px);z-index:0}
.flame{position:relative;z-index:1}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.035) rotate(1deg)}}
.subtitle{font-size:15px;color:#666;margin-top:18px}
.tabs{display:flex;gap:8px;margin-top:34px;width:100%}
.tab{flex:1;border:2px solid #111;background:#fff;padding:12px 8px;font-weight:900;cursor:pointer}
.tab.active{background:#111;color:#fff}
.panel{width:100%;margin-top:14px;text-align:left}
.card{border:2px solid #111;padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.icon{font-size:30px;width:38px;text-align:center}
.card b{display:block;font-size:16px}
.card span{display:block;font-size:13px;color:#666;margin-top:4px}
.locked{opacity:.38}
.progress{height:7px;border:2px solid #111;margin-top:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:#111;width:0}
.reset{margin-top:14px;border:0;background:none;text-decoration:underline;font-size:12px;color:#777;cursor:pointer}
.hidden{display:none}
.footer{font-size:11px;color:#999;text-align:center;margin-top:25px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="lang" id="langBtn">EN</button>
  </div>

  <main class="main">
    <div class="day-label" id="dayLabel">День</div>
    <div class="day-number" id="dayNumber">1</div>

    <div class="flame-wrap">
      <div class="flame-glow"></div>
      <div class="flame">🔥</div>
    </div>

    <div class="subtitle" id="subtitle">Твой огонёк горит</div>

    <div class="tabs">
      <button class="tab active" id="homeTab">Огонёк</button>
      <button class="tab" id="achTab">Достижения</button>
    </div>

    <section class="panel" id="homePanel">
      <div class="card">
        <div class="icon">🔥</div>
        <div>
          <b id="streakTitle">Текущий огонёк</b>
          <span id="streakText">1 день подряд</span>
        </div>
      </div>
      <div class="card">
        <div class="icon">📅</div>
        <div>
          <b id="startTitle">Начало</b>
          <span id="startText">—</span>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="achPanel"></section>
    <button class="reset" id="resetBtn">Сбросить прогресс</button>
  </main>

  <div class="footer" id="footer">Прогресс хранится только на этом устройстве.</div>
</div>

<script>
const achievements = [
  {days:1,  ru:"Первый огонёк", en:"First Flame"},
  {days:7,  ru:"Неделя огня", en:"Week of Fire"},
  {days:30, ru:"Месяц без перерыва", en:"A Month Without a Break"},
  {days:90, ru:"Три месяца пламя", en:"Three Months of Flame"},
  {days:180,ru:"Половина года", en:"Half a Year"},
  {days:365,ru:"Год огня", en:"Year of Fire"},
  {days:720,ru:"Два года огня", en:"Two Years of Fire"},
  {days:1000,ru:"Тысячный день", en:"One Thousand Days"}
];

let lang = localStorage.getItem("flameLang") || "ru";
let data = JSON.parse(localStorage.getItem("flameData") || "null");
const today = new Date();
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

if (!data) {
  data = {days:1, lastVisit:dateKey(today), started:dateKey(today)};
  save();
} else {
  const last = new Date(data.lastVisit + "T00:00:00");
  const now = new Date(dateKey(today) + "T00:00:00");
  const diff = Math.round((now-last)/86400000);
  if (diff === 1) {
    data.days++;
    data.lastVisit = dateKey(today);
    save();
  } else if (diff > 1) {
    // Пропущен день — серия начинается заново.
    data.days = 1;
    data.lastVisit = dateKey(today);
    data.started = dateKey(today);
    save();
  }
}

function save(){localStorage.setItem("flameData",JSON.stringify(data));}

function t(ru,en){return lang==="ru"?ru:en;}

function render(){
  document.documentElement.lang=lang;
  document.getElementById("langBtn").textContent=lang==="ru"?"EN":"RU";
  document.getElementById("dayLabel").textContent=t("День","Day");
  document.getElementById("dayNumber").textContent=data.days;
  document.getElementById("subtitle").textContent=t("Твой огонёк горит","Your flame is burning");
  document.getElementById("homeTab").textContent=t("Огонёк","Flame");
  document.getElementById("achTab").textContent=t("Достижения","Achievements");
  document.getElementById("streakTitle").textContent=t("Текущий огонёк","Current flame");
  document.getElementById("streakText").textContent=data.days+" "+(lang==="ru"?(data.days===1?"день подряд":data.days<5?"дня подряд":"дней подряд"):(data.days===1?"day in a row":"days in a row"));
  document.getElementById("startTitle").textContent=t("Начало","Started");
  document.getElementById("startText").textContent=data.started;
  document.getElementById("footer").textContent=t("Прогресс хранится только на этом устройстве.","Your progress is stored only on this device.");
  document.getElementById("resetBtn").textContent=t("Сбросить прогресс","Reset progress");

  const panel=document.getElementById("achPanel");
  panel.innerHTML="";
  achievements.forEach(a=>{
    const unlocked=data.days>=a.days;
    const percent=Math.min(100,Math.round(data.days/a.days*100));
    const card=document.createElement("div");
    card.className="card "+(unlocked?"":"locked");
    card.innerHTML=`<div class="icon">${unlocked?"🔥":"🔒"}</div>
      <div style="flex:1"><b>${a.days} ${lang==="ru"?"дн.":"days"} — ${lang==="ru"?a.ru:a.en}</b>
      <span>${unlocked?t("Получено","Unlocked"):t("Скоро...","Coming soon")}</span>
      <div class="progress"><i style="width:${percent}%"></i></div></div>`;
    panel.appendChild(card);
  });
}
document.getElementById("langBtn").onclick=()=>{
  lang=lang==="ru"?"en":"ru";localStorage.setItem("flameLang",lang);render();
};
document.getElementById("homeTab").onclick=()=>{
  document.getElementById("homeTab").classList.add("active");
  document.getElementById("achTab").classList.remove("active");
  document.getElementById("homePanel").classList.remove("hidden");
  document.getElementById("achPanel").classList.add("hidden");
};
document.getElementById("achTab").onclick=()=>{
  document.getElementById("achTab").classList.add("active");
  document.getElementById("homeTab").classList.remove("active");
  document.getElementById("achPanel").classList.remove("hidden");
  document.getElementById("homePanel").classList.add("hidden");
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm(t("Сбросить весь прогресс?","Reset all progress?"))){
    localStorage.removeItem("flameData"); location.reload();
  }
};
render();
</script>
</body>
</html>
