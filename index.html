<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        body {
            background-color: #ffffff; /* Белый фон */
            color: #333333;            /* Тёмно-серый текст для читаемости */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 600px;
        }

        .btn {
            margin-top: 24px;
            padding: 12px 28px;
            background-color: #333333;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>
    <h1>Добро пожаловать!</h1>
    <p>Это простой сайт с белым фоном. Вы можете изменить этот текст, добавить свои разделы или картинки.</p>
    <a href="#" class="btn">Кнопка</a>
</body>
</html>
