<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Держи огонёк 🔥 — ТикТок ивенты</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 16px;
      touch-action: pan-y; /* Чтобы скролл не мешал */
    }

    .app {
      max-width: 560px;
      width: 100%;
      background: rgba(20, 25, 40, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 28px 20px 32px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 180, 60, 0.2);
      border: 1px solid rgba(255, 200, 100, 0.3);
      transition: box-shadow 0.3s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 8px;
    }

    .timer-badge {
      background: #2a2f44;
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 600;
      font-size: 1.1rem;
      color: #ffd966;
      box-shadow: inset 0 0 6px #00000055, 0 4px 8px #00000033;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-badge span {
      font-size: 1.4rem;
      line-height: 1;
    }

    .fire-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 8px 0 4px;
      position: relative;
    }

    .flame-zone {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none; /* Чтобы не выделялся */
    }

    .flame-zone.active {
      transform: scale(1.02);
      filter: drop-shadow(0 0 35px #ffaa33);
    }

    .flame-emoji {
      font-size: 130px;
      line-height: 1;
      filter: drop-shadow(0 0 25px #ffb347);
      transition: all 0.15s;
      transform-origin: center;
      animation: pulse-fire 2s infinite alternate ease-in-out;
    }

    @keyframes pulse-fire {
      0% { transform: scale(1); filter: drop-shadow(0 0 15px #ff8c00); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 45px #ffaa00); }
    }

    .flame-zone.active .flame-emoji {
      animation: none;
      transform: scale(1.15);
      filter: drop-shadow(0 0 55px #ffbb33) brightness(1.3);
    }

    /* Индикатор удержания */
    .hold-indicator {
      width: 80%;
      height: 8px;
      background: #232838;
      border-radius: 20px;
      margin: 20px auto 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px #00000088;
      transition: opacity 0.3s;
    }

    .hold-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff7b00, #ffd966, #ffaa33);
      border-radius: 20px;
      transition: width 0.08s linear;
      box-shadow: 0 0 12px #ffb347;
    }

    .hold-label {
      text-align: center;
      font-size: 0.9rem;
      color: #b9c2d4;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .status-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e2336;
      border-radius: 60px;
      padding: 12px 22px;
      margin: 8px 0 18px;
      box-shadow: inset 0 2px 6px #00000055, 0 6px 12px #00000033;
    }

    .streak {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: #ffe28c;
    }

    .streak .number {
      font-size: 2.4rem;
      line-height: 1;
      color: #ffbb33;
      text-shadow: 0 0 16px #ffaa33;
    }

    .event-message {
      font-size: 0.95rem;
      color: #aab3cc;
      text-align: right;
      max-width: 55%;
      word-break: break-word;
      transition: color 0.2s;
    }

    .event-message.highlight {
      color: #ffd966;
      text-shadow: 0 0 10px #ffb347;
      font-weight: 600;
    }

    .events-log {
      background: #0f1320;
      border-radius: 36px;
      padding: 16px 18px;
      margin-top: 12px;
      border: 1px solid #2d3348;
      box-shadow: inset 0 0 14px #00000055;
    }

    .events-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e0e6f0;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 6px;
    }

    .events-title .dot {
      width: 10px;
      height: 10px;
      background: #ff5e00;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff7b00;
      animation: blink 1.6s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .log-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 6px;
    }

    .log-list::-webkit-scrollbar {
      width: 5px;
    }

    .log-list::-webkit-scrollbar-track {
      background: #1e2233;
      border-radius: 10px;
    }

    .log-list::-webkit-scrollbar-thumb {
      background: #ffb347;
      border-radius: 10px;
      box-shadow: 0 0 8px #ffaa33;
    }

    .log-entry {
      background: #1a1f30;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 0.9rem;
      color: #ccd6f0;
      border-left: 6px solid #ffaa33;
      box-shadow: 0 2px 6px #00000033;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .log-entry .time {
      color: #7c8aa8;
      font-size: 0.75rem;
      margin-left: 10px;
      font-weight: 400;
    }

    .empty-log {
      color: #5a6480;
      font-style: italic;
      font-size: 0.9rem;
      text-align: center;
      padding: 18px 0;
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
<div class="app no-select">
  <div class="header">
    <div class="timer-badge">
      <span>⏳</span> <span id="timerDisplay">05:00</span>
    </div>
    <div class="timer-badge" style="background:#1e1f2c;">
      <span>🔥</span> <span id="fireStatus">Удерживай</span>
    </div>
  </div>

  <div class="fire-container">
    <div class="flame-zone" id="flameZone">
      <div class="flame-emoji" id="flameEmoji">🔥</div>
    </div>
    <div class="hold-indicator">
      <div class="hold-progress" id="holdProgress"></div>
    </div>
    <div class="hold-label" id="holdLabel">ЗАЖМИ И ДЕРЖИ</div>
  </div>

  <div class="status-area">
    <div class="streak">
      <span>🔥</span>
      <span class="number" id="streakCount">0</span>
    </div>
    <div class="event-message" id="eventMessage">Удерживай огонёк!</div>
  </div>

  <div class="events-log">
    <div class="events-title">
      <span class="dot"></span> ИВЕНТЫ (каждые 5 мин)
    </div>
    <div class="log-list" id="logList">
      <div class="empty-log">Пока нет событий...</div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ========== КОНФИГ ==========
    const EVENT_INTERVAL_MS = 5 * 60 * 1000; // 5 минут
    const HOLD_THRESHOLD_MS = 1000;          // 1 секунда удержания для "сработки"
    const TICK_RATE_MS = 40;                 // частота обновления прогресса

    // ========== СОСТОЯНИЕ ==========
    let isHolding = false;
    let holdStartTime = 0;
    let holdProgress = 0;          // 0..1
    let streak = 0;                // сколько раз успешно удержал (по 1 сек)
    let lastHoldSuccessTime = 0;   // чтобы не спамить streak

    // Таймеры
    let eventTimerInterval = null;
    let nextEventTime = Date.now() + EVENT_INTERVAL_MS;
    let uiInterval = null;

    // DOM элементы
    const flameZone = document.getElementById('flameZone');
    const holdProgressEl = document.getElementById('holdProgress');
    const holdLabel = document.getElementById('holdLabel');
    const streakCountEl = document.getElementById('streakCount');
    const eventMessage = document.getElementById('eventMessage');
    const logList = document.getElementById('logList');
    const timerDisplay = document.getElementById('timerDisplay');
    const fireStatus = document.getElementById('fireStatus');

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function formatTime(ms) {
      if (ms < 0) ms = 0;
      const totalSec = Math.floor(ms / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
      const now = Date.now();
      const remaining = Math.max(0, nextEventTime - now);
      timerDisplay.textContent = formatTime(remaining);
    }

    // Добавить запись в лог
    function addLogEntry(text, isEvent = true) {
      // Удаляем пустую заглушку
      const emptyLog = logList.querySelector('.empty-log');
      if (emptyLog) emptyLog.remove();

      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const timeStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      entry.innerHTML = `${text} <span class="time">${timeStr}</span>`;

      logList.prepend(entry); // новые сверху

      // Ограничим количество записей
      if (logList.children.length > 12) {
        logList.removeChild(logList.lastChild);
      }
    }

    // Показать временное сообщение в статусе
    function setEventMessage(text, highlight = true) {
      eventMessage.textContent = text;
      if (highlight) {
        eventMessage.classList.add('highlight');
        setTimeout(() => {
          eventMessage.classList.remove('highlight');
        }, 1200);
      }
    }

    // ========== ЛОГИКА УДЕРЖАНИЯ ==========
    function startHolding(e) {
      e.preventDefault(); // чтобы не скроллилось и не выделялось
      if (isHolding) return;
      isHolding = true;
      holdStartTime = Date.now();
      flameZone.classList.add('active');
      fireStatus.textContent = '🔥 Горит!';
      holdLabel.textContent = 'ДЕРЖИ!';
    }

    function stopHolding(e) {
      if (e) e.preventDefault();
      if (!isHolding) return;
      isHolding = false;
      flameZone.classList.remove('active');
      fireStatus.textContent = 'Удерживай';
      holdLabel.textContent = 'ЗАЖМИ И ДЕРЖИ';

      // Сброс прогресса, если не удержал до порога
      const holdDuration = Date.now() - holdStartTime;
      if (holdDuration < HOLD_THRESHOLD_MS && holdProgress > 0) {
        // Небольшой штраф? Нет, просто сбрасываем.
      }
      holdProgress = 0;
      holdProgressEl.style.width = '0%';
    }

    // Обновление прогресса удержания
    function updateHoldProgress() {
      if (!isHolding) {
        if (holdProgress > 0) {
          // Плавное затухание, если отпустили
          holdProgress = Math.max(0, holdProgress - 0.03);
          holdProgressEl.style.width = (holdProgress * 100) + '%';
          if (holdProgress <= 0.01) {
            holdProgressEl.style.width = '0%';
          }
        }
        return;
      }

      const now = Date.now();
      const heldFor = now - holdStartTime;
      let progress = Math.min(1, heldFor / HOLD_THRESHOLD_MS);
      holdProgress = progress;
      holdProgressEl.style.width = (progress * 100) + '%';

      // Если удержал достаточно и ещё не засчитали в этом цикле
      if (progress >= 1) {
        // Проверяем, не засчитали ли уже (защита от повторного срабатывания)
        if (now - lastHoldSuccessTime > HOLD_THRESHOLD_MS * 0.8) {
          // Увеличиваем streak
          streak += 1;
          streakCountEl.textContent = streak;
          lastHoldSuccessTime = now;

          // Визуальный отклик
          setEventMessage(`🔥 +1 огонёк! (${streak})`, true);
          addLogEntry(`🔥 Удержание +1. Всего: ${streak}`, false);

          // Небольшой визуальный эффект
          flameZone.style.transform = 'scale(1.08)';
          setTimeout(() => {
            if (isHolding) flameZone.style.transform = 'scale(1.02)';
            else flameZone.style.transform = 'scale(1)';
          }, 100);
        }
      }
    }

    // ========== ИВЕНТЫ КАЖДЫЕ 5 МИНУТ ==========
    function triggerRandomEvent() {
      const events = [
        { text: '🎉 БОНУС: +5 к огоньку!', action: () => { streak += 5; streakCountEl.textContent = streak; } },
        { text: '⚡ МОЛНИЯ: удвоение!', action: () => { streak *= 2; streakCountEl.textContent = streak; } },
        { text: '💧 ДОЖДЬ: -3 огонька', action: () => { streak = Math.max(0, streak - 3); streakCountEl.textContent = streak; } },
        { text: '🌟 ЗВЕЗДА: +1 огонёк', action: () => { streak += 1; streakCountEl.textContent = streak; } },
        { text: '🌪️ ВИХРЬ: сброс до 10', action: () => { streak = Math.min(streak, 10); streakCountEl.textContent = streak; } },
        { text: '💎 КРИСТАЛЛ: +10 огоньков!', action: () => { streak += 10; streakCountEl.textContent = streak; } },
        { text: '🔮 ПРОРОЧЕСТВО: следующий ивент x2', action: () => { /* просто шутка */ } },
        { text: '🍀 УДАЧА: +3 огонька', action: () => { streak += 3; streakCountEl.textContent = streak; } },
        { text: '🧨 ВЗРЫВ: -5 огоньков', action: () => { streak = Math.max(0, streak - 5); streakCountEl.textContent = streak; } },
        { text: '✨ СИЯНИЕ: +7 огоньков', action: () => { streak += 7; streakCountEl.textContent = streak; } },
      ];

      const randomEvent = events[Math.floor(Math.random() * events.length)];
      randomEvent.action();

      // Обновляем сообщение
      setEventMessage(randomEvent.text, true);

      // Добавляем в лог
      addLogEntry(`📢 ИВЕНТ: ${randomEvent.text}`);

      // Небольшая тряска для привлечения внимания
      flameZone.style.animation = 'none';
      flameZone.offsetHeight; // reflow
      flameZone.style.animation = 'pulse-fire 0.4s 2';
      setTimeout(() => {
        flameZone.style.animation = '';
      }, 900);
    }

    function startEventTimer() {
      if (eventTimerInterval) clearInterval(eventTimerInterval);
      nextEventTime = Date.now() + EVENT_INTERVAL_MS;

      eventTimerInterval = setInterval(() => {
        const now = Date.now();
        if (now >= nextEventTime) {
          triggerRandomEvent();
          // Планируем следующий ивент через 5 минут от текущего момента
          nextEventTime = now + EVENT_INTERVAL_MS;
        }
        updateTimerDisplay();
      }, 500); // проверяем каждые 0.5 сек
    }

    // ========== ЗАПУСК UI-ЦИКЛА ==========
    function startUiLoop() {
      if (uiInterval) clearInterval(uiInterval);
      uiInterval = setInterval(() => {
        updateHoldProgress();
        // Обновляем статус огня
        if (isHolding) {
          fireStatus.textContent = '🔥 Горит!';
        } else {
          fireStatus.textContent = 'Удерживай';
        }
      }, TICK_RATE_MS);
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    function init() {
      // Начальные значения
      streak = 0;
      streakCountEl.textContent = '0';
      holdProgress = 0;
      holdProgressEl.style.width = '0%';

      // Обработчики удержания (мышь + тач)
      flameZone.addEventListener('mousedown', startHolding);
      window.addEventListener('mouseup', stopHolding);
      flameZone.addEventListener('touchstart', startHolding, { passive: false });
      window.addEventListener('touchend', stopHolding);
      window.addEventListener('touchcancel', stopHolding);

      // На всякий случай, если мышь ушла за пределы
      flameZone.addEventListener('mouseleave', (e) => {
        // Не отпускаем, если кнопка зажата? Лучше отпустить, чтобы не было багов
        if (isHolding) stopHolding(e);
      });

      // Запуск таймеров
      startEventTimer();
      startUiLoop();

      // Первое обновление таймера
      updateTimerDisplay();

      // Приветственный лог
      addLogEntry('🔥 Система готова. Удерживай огонёк!', false);

      // Обработка потери фокуса (чтобы не залипало)
      window.addEventListener('blur', () => {
        if (isHolding) stopHolding();
      });

      // Запрет контекстного меню на огне
      flameZone.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    // Запускаем после загрузки DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
</body>
</html>
